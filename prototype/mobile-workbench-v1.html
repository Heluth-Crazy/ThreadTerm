<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <title>ThreadTerm Mobile Workbench · 完整交互原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1017;
      --app-bg: #10151d;
      --surface: #151b24;
      --surface-2: #1a222d;
      --surface-3: #202a38;
      --glass: rgba(16, 21, 29, .9);
      --text: #e8edf5;
      --text-2: #bdc7d4;
      --muted: #8f9cac;
      --subtle: #667486;
      --border: #2d3948;
      --border-soft: rgba(143, 156, 172, .16);
      --primary: #4f8bd6;
      --primary-strong: #65a4f1;
      --primary-soft: rgba(79, 139, 214, .16);
      --green: #35c66b;
      --green-soft: rgba(53, 198, 107, .13);
      --orange: #f0a23a;
      --orange-soft: rgba(240, 162, 58, .14);
      --red: #ef5b61;
      --red-soft: rgba(239, 91, 97, .14);
      --purple: #a879e8;
      --purple-soft: rgba(168, 121, 232, .14);
      --cyan: #49b8c7;
      /* 终端表面 chrome（默认锁深色画布；主题包可整组覆盖，对应 PC 端 terminal token） */
      --terminal-canvas: #090c11;
      --terminal-chrome: #0e1218;
      --terminal-chrome-border: #232a34;
      --terminal-fg: #d6ded7;
      --terminal-dim: #778291;
      --terminal-green: #7bd88f;
      --terminal-blue: #72aeea;
      --terminal-yellow: #e7be71;
      --terminal-red: #f07b80;
      --terminal-key-bg: #171d26;
      --terminal-key-border: #2c3542;
      --terminal-key-fg: #aab5c1;
      --shadow: 0 24px 80px rgba(0, 0, 0, .48);
      --radius: 12px;
      --radius-sm: 8px;
      --tap: 44px;
      --phone-w: 390px;
      --phone-h: 844px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "Microsoft YaHei UI", sans-serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #dfe5ec;
      --app-bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f7f9fb;
      --surface-3: #e9eef4;
      --glass: rgba(244, 246, 249, .9);
      --text: #15202e;
      --text-2: #344255;
      --muted: #667488;
      --subtle: #8390a0;
      --border: #d6dee8;
      --border-soft: rgba(53, 68, 87, .12);
      --primary: #3378c5;
      --primary-strong: #2469b7;
      --primary-soft: rgba(51, 120, 197, .12);
      /* 浅色主题下状态色需要更深的变体（亮绿/亮橙在白底上对比度不足） */
      --green: #1e9b52;
      --orange: #c56a10;
      --red: #d63c44;
      --purple: #8b53c9;
      --cyan: #2e8f9c;
      --green-soft: rgba(30, 155, 82, .1);
      --orange-soft: rgba(213, 128, 16, .11);
      --red-soft: rgba(214, 60, 68, .1);
      --purple-soft: rgba(137, 83, 201, .11);
      --shadow: 0 24px 70px rgba(43, 59, 78, .25);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 10%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 27rem),
        radial-gradient(circle at 82% 84%, color-mix(in srgb, var(--cyan) 9%, transparent), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary-strong);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .45; }
    /* 触屏没有 hover，按压反馈统一用 :active（tap-highlight 已全局关闭） */
    .icon-button:active, .primary-button:active, .secondary-button:active, .danger-button:active,
    .text-button:active, .chip:active, .summary-card:active, .attention-card:active,
    .group-card:active, .session-main:active, .session-menu:active, .nav-button:active,
    .settings-row:active, .sheet-option:active, .choice-card:active, .scope-button:active,
    .key-button:active, .review-button:active, .banner-action:active, .search-clear:active {
      opacity: .72;
    }
    svg { display: block; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 24px; height: 24px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .prototype-stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 272px var(--phone-w);
      justify-content: center;
      align-items: center;
      gap: 44px;
      padding: 36px;
    }

    .review-panel {
      align-self: center;
      color: var(--text-2);
    }
    .review-kicker {
      margin: 0 0 8px;
      color: var(--primary-strong);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .review-panel h1 {
      margin: 0;
      color: var(--text);
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -.02em;
    }
    .review-copy { margin: 12px 0 22px; color: var(--muted); font-size: 13px; }
    .review-group { margin-top: 20px; }
    .review-label {
      display: block;
      margin-bottom: 8px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .review-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .review-button {
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(21, 27, 36, .72);
      color: var(--text-2);
      cursor: pointer;
      font-size: 12px;
    }
    .review-button:hover { border-color: var(--primary); color: var(--text); }
    .review-button[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
    }
    .review-note {
      display: flex;
      gap: 9px;
      margin-top: 22px;
      padding: 11px 12px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      background: rgba(21, 27, 36, .48);
      color: var(--muted);
      font-size: 11px;
    }

    .phone-shell {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      overflow: hidden;
      border: 1px solid rgba(143, 156, 172, .28);
      border-radius: 36px;
      background: var(--app-bg);
      box-shadow: var(--shadow);
      isolation: isolate;
    }
    .phone-shell::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      border: 7px solid rgba(255, 255, 255, .035);
      border-radius: inherit;
    }
    .status-bar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 40;
      height: 29px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 19px 5px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-signal { display: flex; align-items: flex-end; gap: 1px; height: 10px; }
    .status-signal i { display: block; width: 2px; border-radius: 1px; background: currentColor; }
    .status-signal i:nth-child(1) { height: 3px; }
    .status-signal i:nth-child(2) { height: 5px; }
    .status-signal i:nth-child(3) { height: 7px; }
    .status-signal i:nth-child(4) { height: 9px; }
    .battery { width: 20px; height: 9px; border: 1px solid currentColor; border-radius: 2px; padding: 1px; }
    .battery::after { content: ""; display: block; width: 76%; height: 100%; border-radius: 1px; background: currentColor; }

    .app-screen {
      position: absolute;
      inset: 29px 0 74px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: var(--app-bg);
    }
    .app-screen::-webkit-scrollbar, .chip-row::-webkit-scrollbar, .key-row::-webkit-scrollbar { display: none; }
    .page { min-height: 100%; padding-bottom: 24px; }
    .page-header {
      position: sticky;
      top: 0;
      z-index: 12;
      padding: 13px 16px 11px;
      border-bottom: 1px solid transparent;
      background: var(--glass);
      backdrop-filter: blur(18px);
    }
    .page-header.scrolled { border-color: var(--border-soft); }
    .header-row { display: flex; align-items: center; gap: 9px; min-height: 44px; }
    .header-title { min-width: 0; flex: 1; }
    .header-title h2 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; }
    .header-subtitle {
      display: flex; align-items: center; gap: 5px; margin-top: 3px;
      color: var(--muted); font-size: 11px;
    }
    .online-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .online-dot.offline { background: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }

    .icon-button {
      position: relative;
      width: var(--tap);
      height: var(--tap);
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }
    .icon-button:hover { background: var(--surface-3); color: var(--text); }
    .icon-button.filled { background: var(--surface-2); }
    .notification-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      border: 2px solid var(--app-bg);
      border-radius: 10px;
      background: var(--red);
      color: white;
      font-size: 9px;
      font-weight: 800;
    }

    .primary-button, .secondary-button, .danger-button, .text-button {
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .primary-button { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
    .primary-button:hover { background: var(--primary-strong); }
    .secondary-button { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
    .secondary-button:hover { border-color: var(--primary); }
    .danger-button { border: 1px solid rgba(239, 91, 97, .45); background: var(--red-soft); color: var(--red); }
    .text-button { min-height: 38px; padding: 0 9px; border: 0; background: transparent; color: var(--primary-strong); }
    .full-button { width: 100%; }

    .content { padding: 0 16px; }
    .section { margin-top: 20px; }
    .section-head {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }
    .section-head h3 { margin: 0; flex: 1; font-size: 15px; }
    .section-note { color: var(--muted); font-size: 11px; }
    .count { color: var(--muted); font-weight: 500; }

    .scope-button {
      max-width: 100%;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      font-size: 12px;
    }
    .scope-button:hover { border-color: var(--primary); color: var(--text); }
    .scope-label { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .connection-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 4px 16px 0;
      padding: 11px 12px;
      border: 1px solid rgba(240, 162, 58, .3);
      border-radius: var(--radius-sm);
      background: var(--orange-soft);
      color: var(--text-2);
      font-size: 12px;
    }
    .connection-banner .icon { flex: 0 0 auto; color: var(--orange); }
    .connection-copy { min-width: 0; flex: 1; }
    .connection-copy strong { display: block; margin-bottom: 2px; color: var(--text); }
    .banner-action {
      min-height: 28px;
      padding: 0 7px;
      border: 0;
      background: transparent;
      color: var(--orange);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
    }
    .search-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .search-wrap input {
      min-width: 0;
      height: 42px;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }
    .search-clear {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }
    .summary-card {
      min-height: 82px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 11px 12px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }
    .summary-card:hover, .summary-card[aria-pressed="true"] { border-color: var(--tone, var(--primary)); background: var(--tone-bg, var(--primary-soft)); }
    .summary-top { width: 100%; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .summary-value { font-size: 25px; font-weight: 750; line-height: 1; letter-spacing: -.03em; }
    .summary-card.action { --tone: var(--orange); --tone-bg: var(--orange-soft); }
    .summary-card.running { --tone: var(--green); --tone-bg: var(--green-soft); }
    .summary-card.review { --tone: var(--purple); --tone-bg: var(--purple-soft); }
    .summary-card.failed { --tone: var(--red); --tone-bg: var(--red-soft); }
    .overlap-note { margin: 7px 2px 0; color: var(--subtle); font-size: 10px; }

    .chip-row {
      display: flex;
      gap: 7px;
      margin: 0 -16px;
      padding: 0 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chip {
      min-height: 36px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      font-size: 12px;
    }
    .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-strong); }
    .chip-count { color: var(--muted); font-size: 10px; }

    .stack { display: grid; gap: 9px; }
    .attention-card, .group-card, .session-card {
      position: relative;
      width: 100%;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
    }
    .attention-card {
      display: grid;
      grid-template-columns: 4px minmax(0, 1fr) 24px;
      gap: 11px;
      padding: 12px 10px 12px 0;
      cursor: pointer;
      text-align: left;
    }
    .attention-card:hover, .group-card:hover { border-color: var(--border); background: var(--surface-2); }
    .severity-line { align-self: stretch; border-radius: 0 4px 4px 0; background: var(--tone); }
    .tone-approval { --tone: var(--orange); --tone-bg: var(--orange-soft); }
    .tone-input { --tone: var(--primary); --tone-bg: var(--primary-soft); }
    .tone-failed { --tone: var(--red); --tone-bg: var(--red-soft); }
    .tone-review { --tone: var(--purple); --tone-bg: var(--purple-soft); }
    .tone-stalled { --tone: var(--cyan); --tone-bg: rgba(73, 184, 199, .13); }
    .card-main { min-width: 0; }
    .card-topline { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
    .status-pill {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--tone-bg, var(--surface-3));
      color: var(--tone, var(--text-2));
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }
    .card-time { margin-left: auto; color: var(--subtle); font-size: 10px; white-space: nowrap; }
    .card-title { margin: 0; font-size: 13px; line-height: 1.4; font-weight: 700; }
    .card-evidence {
      display: -webkit-box;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      overflow: hidden;
      color: var(--subtle);
      font-size: 10px;
    }
    .card-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chevron { align-self: center; color: var(--subtle); }

    .group-card {
      display: block;
      padding: 12px;
      cursor: pointer;
      text-align: left;
    }
    .group-head { display: flex; align-items: flex-start; gap: 9px; }
    .group-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-3);
      color: var(--text-2);
    }
    .group-info { min-width: 0; flex: 1; }
    .group-title { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .group-path { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 10px/1.4 "SFMono-Regular", Consolas, monospace; }
    .group-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .mini-stat { min-height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 7px; background: var(--surface-2); color: var(--muted); font-size: 10px; }
    .mini-stat.attention { background: var(--orange-soft); color: var(--orange); }
    .mini-stat.failure { background: var(--red-soft); color: var(--red); }
    .mini-stat.live { background: var(--green-soft); color: var(--green); }

    .empty-state {
      display: grid;
      justify-items: center;
      padding: 28px 16px 14px;
      color: var(--muted);
      text-align: center;
    }
    .empty-icon { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 16px; background: var(--surface-2); color: var(--subtle); }
    .empty-state h4 { margin: 0 0 5px; color: var(--text); font-size: 14px; }
    .empty-state p { max-width: 260px; margin: 0 0 15px; font-size: 12px; }

    .bottom-nav {
      position: absolute;
      inset: auto 0 0;
      z-index: 30;
      height: 74px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px 13px max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-soft);
      background: var(--glass);
      backdrop-filter: blur(20px);
    }
    .nav-button {
      position: relative;
      min-width: 0;
      min-height: 55px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }
    .nav-button[aria-current="page"] { color: var(--primary-strong); }
    .nav-button[aria-current="page"]::before {
      content: "";
      position: absolute;
      top: 1px;
      width: 28px;
      height: 3px;
      border-radius: 2px;
      background: var(--primary);
    }
    .nav-dot { position: absolute; top: 5px; left: calc(50% + 7px); width: 7px; height: 7px; border: 2px solid var(--glass); border-radius: 50%; background: var(--red); }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-3);
    }
    .segment {
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .segment[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }

    .session-group { margin-top: 18px; }
    .session-group-head { display: flex; align-items: center; gap: 7px; margin: 0 2px 7px; color: var(--muted); font-size: 11px; }

    .session-main {
      min-width: 0;

      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px 10px 11px;

      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .terminal-mark {

    .session-preview { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--subtle); font: 10px/1.4 "SFMono-Regular", Consolas, monospace; }
    .session-menu { width: 44px; flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); cursor: pointer; }

    .status-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--subtle); }

    .status-dot.waiting { background: var(--orange); }
    .status-dot.failed { background: var(--red); }

    .settings-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 7px;
      padding: 14px;

      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--surface), var(--surface-2));

    .settings-hero-info span { color: var(--muted); font-size: 11px; }

    .settings-group-title { margin: 0 0 7px 3px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .settings-list { overflow: hidden; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--surface); }
    .settings-row {
      width: 100%;
      min-height: 57px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 11px;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row:hover { background: var(--surface-2); }
    .settings-icon { width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px; background: var(--surface-3); color: var(--text-2); }
    .settings-info { min-width: 0; flex: 1; }
    .settings-info strong { display: block; font-size: 13px; }
    .settings-info span { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .row-value { max-width: 105px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .switch {
      position: relative;
      width: 46px;
      height: 28px;

      border: 0;
      border-radius: 15px;

      transition: background .18s ease;
    }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .18s ease; }
    .switch[aria-checked="true"] { background: var(--primary); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }

    .push-layer {
      position: absolute;
      inset: 29px 0 0;
      z-index: 50;
      overflow: hidden;
      background: var(--app-bg);
      transform: translateX(102%);
      transition: transform .24s cubic-bezier(.22, .82, .28, 1);
    }
    .push-layer.open { transform: translateX(0); }
    .push-page { height: 100%; display: flex; flex-direction: column; background: var(--app-bg); }
    .push-header {
      min-height: 58px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--glass);
      backdrop-filter: blur(18px);
    }
    .push-header h2 { min-width: 0; flex: 1; margin: 0; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .push-body { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .push-body::-webkit-scrollbar { display: none; }
    .push-content { padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .push-footer {
      flex: 0 0 auto;
      padding: 10px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-soft);
      background: var(--glass);
      backdrop-filter: blur(18px);
    }

    .detail-hero { padding: 14px; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--surface); }
    .detail-hero h3 { margin: 10px 0 6px; font-size: 18px; line-height: 1.35; }
    .detail-hero p { margin: 0; color: var(--muted); font-size: 12px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .detail-field { min-width: 0; padding: 10px; border-radius: 9px; background: var(--surface-2); }
    .detail-field span { display: block; color: var(--subtle); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
    .detail-field strong { display: block; margin-top: 4px; overflow-wrap: anywhere; color: var(--text-2); font-size: 11px; }
    .evidence-box { margin-top: 14px; padding: 12px; border-left: 3px solid var(--tone, var(--primary)); border-radius: 0 9px 9px 0; background: var(--surface-2); color: var(--text-2); font: 11px/1.55 "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding-bottom: 15px; color: var(--text-2); font-size: 11px; }
    .timeline-item:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 18px; bottom: 0; width: 1px; background: var(--border); }
    .timeline-dot { position: relative; z-index: 1; width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-3); color: var(--muted); }
    .timeline-item time { display: block; margin-top: 3px; color: var(--subtle); font-size: 9px; }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 70;
      border: 0;
      background: rgba(0, 0, 0, .58);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      inset: auto 0 0;
      z-index: 71;
      max-height: calc(100% - 54px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 20px 20px 0 0;
      background: var(--app-bg);
      box-shadow: 0 -20px 60px rgba(0,0,0,.35);
      transform: translateY(102%);
      transition: transform .24s cubic-bezier(.22, .82, .28, 1);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 4px; flex: 0 0 auto; margin: 8px auto 2px; border-radius: 2px; background: var(--border); }
    .sheet-header { min-height: 50px; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 16px; border-bottom: 1px solid var(--border-soft); }
    .sheet-header h3 { min-width: 0; flex: 1; margin: 0; font-size: 16px; }
    .sheet-body { min-height: 0; overflow-y: auto; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet-option {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }
    .sheet-option:last-child { border-bottom: 0; }
    .sheet-option:hover { color: var(--primary-strong); }
    .sheet-option .option-copy { min-width: 0; flex: 1; }
    .sheet-option strong, .sheet-option span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-option span { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .check-mark { color: var(--primary-strong); }

    .form-grid { display: grid; gap: 14px; }
    .field label, .field-label { display: block; margin: 0 0 6px 2px; color: var(--text-2); font-size: 11px; font-weight: 650; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 46px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .field-hint { margin: 5px 2px 0; color: var(--subtle); font-size: 10px; }
    .field-error { margin: 5px 2px 0; color: var(--red); font-size: 10px; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .choice-card { min-height: 72px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-2); cursor: pointer; text-align: left; }
    .choice-card[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
    .choice-card strong { display: block; font-size: 12px; }
    .choice-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .pack-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 2px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: linear-gradient(135deg, var(--swatch-bg) 62%, var(--swatch-primary) 62%);
      vertical-align: -2px;
    }

    .dialog {
      width: calc(100% - 34px);
      max-width: 340px;
      margin: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .dialog h3 { margin: 0 0 7px; font-size: 17px; }
    .dialog p { margin: 0; color: var(--muted); font-size: 12px; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 17px; }

    .toast {
      position: absolute;
      z-index: 90;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      max-width: calc(100% - 32px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--text);
      color: var(--app-bg);
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .18s ease, transform .18s ease;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .push-layer.open ~ .toast { bottom: calc(18px + env(safe-area-inset-bottom)); }

    .terminal-page { height: 100%; display: flex; flex-direction: column; background: var(--terminal-canvas); color: var(--terminal-fg); }
    .terminal-header { min-height: 58px; flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-bottom: 1px solid var(--terminal-chrome-border); background: var(--terminal-chrome); }
    .terminal-header-title { min-width: 0; flex: 1; }
    .terminal-header-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .terminal-header-title span { display: flex; align-items: center; gap: 5px; margin-top: 2px; color: var(--terminal-dim); font-size: 9px; }
    .terminal-output { min-height: 0; flex: 1; overflow: auto; padding: 12px 12px 24px; overscroll-behavior: contain; font: 11px/1.55 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .terminal-line { min-height: 17px; }
    .terminal-line.dim { color: var(--terminal-dim); }
    .terminal-line.green { color: var(--terminal-green); }
    .terminal-line.blue { color: var(--terminal-blue); }
    .terminal-line.yellow { color: var(--terminal-yellow); }
    .terminal-line.red { color: var(--terminal-red); }
    .terminal-input-zone { flex: 0 0 auto; border-top: 1px solid var(--terminal-chrome-border); background: var(--terminal-chrome); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .key-row { display: flex; gap: 5px; padding: 7px 9px 5px; overflow-x: auto; scrollbar-width: none; }
    .key-button { min-width: 42px; min-height: 38px; flex: 0 0 auto; padding: 0 10px; border: 1px solid var(--terminal-key-border); border-radius: 7px; background: var(--terminal-key-bg); color: var(--terminal-key-fg); cursor: pointer; font: 10px "SFMono-Regular", Consolas, monospace; }
    .key-button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-strong); }
    .input-row { display: flex; align-items: flex-end; gap: 7px; padding: 3px 9px 0; }
    .input-row textarea { min-height: 44px; max-height: 104px; flex: 1; resize: none; padding: 10px 11px; border: 1px solid var(--terminal-key-border); border-radius: 10px; outline: 0; background: var(--terminal-key-bg); color: var(--terminal-fg); font-size: 16px; }
    .input-row textarea:focus { border-color: var(--primary); }
    .send-button { width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--primary); color: var(--primary-foreground, #fff); cursor: pointer; }
    .readonly-note { display: flex; align-items: center; gap: 7px; margin: 7px 9px 0; padding: 8px 9px; border-radius: 8px; background: var(--orange-soft); color: var(--orange); font-size: 10px; }

    .qr-card { display: grid; justify-items: center; padding: 18px; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--surface); }
    .qr-code { width: 154px; height: 154px; padding: 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px #d4d8de; }
    .qr-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(13, 1fr); gap: 1px; background: #fff; }
    .qr-grid i { background: transparent; }
    .qr-grid i.on { background: #0c1219; }
    .pair-code { margin-top: 12px; color: var(--text); font: 700 18px/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: .16em; }
    .pair-note { margin-top: 6px; color: var(--muted); font-size: 10px; text-align: center; }

    .notification-item { width: 100%; display: grid; grid-template-columns: 9px minmax(0,1fr) 20px; gap: 9px; padding: 12px 3px; border: 0; border-bottom: 1px solid var(--border-soft); background: transparent; color: var(--text); cursor: pointer; text-align: left; }
    .notification-item:last-child { border-bottom: 0; }
    .notification-item.read { opacity: .62; }
    .unread-dot { width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--primary); }
    .notification-item.read .unread-dot { background: transparent; }
    .notification-copy strong { display: block; font-size: 12px; }
    .notification-copy span { display: -webkit-box; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 10px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .notification-copy time { display: block; margin-top: 5px; color: var(--subtle); font-size: 9px; }

    .info-card { padding: 12px; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--surface); color: var(--text-2); font-size: 11px; }
    .info-card strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 12px; }
    .warning-card { border-color: rgba(240, 162, 58, .25); background: var(--orange-soft); }
    .danger-zone { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input { min-width: 0; flex: 1; accent-color: var(--primary); }
    .range-value { width: 48px; color: var(--muted); font-size: 11px; text-align: right; }

    @media (max-width: 720px) {
      body { overflow: hidden; background: var(--app-bg); }
      .prototype-stage { display: block; min-height: 100dvh; padding: 0; }
      .review-panel { display: none; }
      .phone-shell { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      .phone-shell::after { display: none; }
    }

    @media (max-width: 370px) {
      .page-header, .content { padding-left: 12px; padding-right: 12px; }
      .connection-banner { margin-left: 12px; margin-right: 12px; }
      .chip-row { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; }
      .summary-card { min-height: 76px; padding: 9px 10px; }
      .summary-value { font-size: 23px; }
      .scope-label { max-width: 145px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .status-bar { height: 22px; padding-bottom: 2px; }
      .app-screen { inset: 22px 0 60px; }
      .bottom-nav { height: 60px; padding-top: 2px; padding-bottom: 3px; }
      .nav-button { min-height: 50px; }
      .push-layer { inset: 22px 0 0; }
      .page-header { position: relative; }
      .summary-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .summary-card { min-height: 64px; }
      .terminal-header { min-height: 48px; }
      .key-row { padding-top: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

        terminal: { background: "#1a1b26", foreground: "#c0caf5", dim: "#414868", green: "#9ece6a", brightGreen: "#9ece6a", blue: "#7aa2f7", brightBlue: "#7aa2f7", yellow: "#e0af68", brightYellow: "#e0af68", red: "#f7768e", brightRed: "#f7768e", cyan: "#7dcfff", magenta: "#bb9af7" }
      },
      "gruvbox": {
        label: "Gruvbox Dark", mode: "dark",
        app: { background: "#282828", foreground: "#ebdbb2", card: "#32302f", primary: "#fabd2f", mutedForeground: "#a89984", border: "#504945" },
        terminal: { background: "#282828", foreground: "#ebdbb2", dim: "#928374", green: "#98971a", brightGreen: "#b8bb26", blue: "#458588", brightBlue: "#83a598", yellow: "#d79921", brightYellow: "#fabd2f", red: "#cc241d", brightRed: "#fb4934", cyan: "#689d6a", magenta: "#b16286" }
      },
      "everforest-light": {
        label: "Everforest 浅色", mode: "light",
        app: { background: "#efebd4", foreground: "#5c6a72", card: "#f4f0d9", primary: "#6c7b01", mutedForeground: "#646c63", border: "#d8d3ba" },
        terminal: { background: "#efebd4", foreground: "#5c6a72", dim: "#7d8b74", green: "#5c713d", brightGreen: "#7c8e01", blue: "#3d736c", brightBlue: "#388ebe", yellow: "#7f6634", brightYellow: "#b07e00", red: "#ca272a", brightRed: "#f7423f", cyan: "#3c764b", magenta: "#ad4576" }
      },
      "nord": {
        label: "Nord", mode: "dark",
        app: { background: "#242933", foreground: "#eceff4", card: "#2e3440", primary: "#88c0d0", mutedForeground: "#d8dee9", border: "#3b4252" },
        terminal: { background: "#242933", foreground: "#e5e9f0", dim: "#4c566a", green: "#a3be8c", brightGreen: "#b8d59d", blue: "#81a1c1", brightBlue: "#91b5d4", yellow: "#ebcb8b", brightYellow: "#f5d794", red: "#bf616a", brightRed: "#d08770", cyan: "#8fbcbb", magenta: "#b48ead" }
      }
    };

    const hexChannels = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const mixHex = (a, b, ratio) => {
      const ca = hexChannels(a);
      const cb = hexChannels(b);
      return "#" + ca.map((v, i) => Math.round(v + (cb[i] - v) * ratio).toString(16).padStart(2, "0")).join("");
    };
    const rgbaHex = (hex, alpha) => {
      const [r, g, b] = hexChannels(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    // 由 6 个 app token + 终端 ANSI 派生出原型整套 CSS 变量。
    // 状态色映射与 PC 端语义 token 对齐：green=success、orange=warning、red=destructive、
    // cyan=info；亮色主题用正常色（对比度 ≥4.5），暗色主题用 bright 变体。
    function derivePackVars(pack) {
      const dark = pack.mode === "dark";
      const { app, terminal: term } = pack;
      const statusGreen = dark ? term.brightGreen : term.green;
      const statusOrange = dark ? term.brightYellow : term.yellow;
      const statusRed = dark ? term.brightRed : term.red;
      return {
        "--bg": mixHex(app.background, "#000000", dark ? 0.25 : 0.06),
        "--app-bg": app.background,
        "--surface": app.card,
        "--surface-2": mixHex(app.card, app.foreground, 0.04),
        "--surface-3": mixHex(app.card, app.foreground, 0.08),
        "--glass": rgbaHex(app.background, 0.9),
        "--text": app.foreground,
        "--text-2": mixHex(app.foreground, app.background, 0.18),
        "--muted": app.mutedForeground,
        "--subtle": mixHex(app.mutedForeground, app.background, 0.28),
        "--border": app.border,
        "--border-soft": rgbaHex(app.mutedForeground, 0.16),
        "--primary": app.primary,
        "--primary-strong": mixHex(app.primary, dark ? "#ffffff" : "#000000", dark ? 0.15 : 0.12),
        "--primary-soft": rgbaHex(app.primary, dark ? 0.16 : 0.12),
        "--green": statusGreen,
        "--green-soft": rgbaHex(statusGreen, 0.13),
        "--orange": statusOrange,
        "--orange-soft": rgbaHex(statusOrange, 0.14),
        "--red": statusRed,
        "--red-soft": rgbaHex(statusRed, 0.14),
        "--purple": term.magenta,
        "--purple-soft": rgbaHex(term.magenta, 0.14),
        "--cyan": term.cyan,
        "--shadow": dark ? "0 24px 80px rgba(0, 0, 0, .48)" : "0 24px 70px rgba(43, 59, 78, .25)",
        "--terminal-canvas": term.background,
        "--terminal-chrome": mixHex(term.background, term.foreground, 0.05),
        "--terminal-chrome-border": mixHex(term.background, term.foreground, 0.14),
        "--terminal-fg": term.foreground,
        "--terminal-dim": term.dim,
        "--terminal-green": dark ? term.brightGreen : term.green,
        "--terminal-blue": dark ? term.brightBlue : term.blue,
        "--terminal-yellow": dark ? term.brightYellow : term.yellow,
        "--terminal-red": dark ? term.brightRed : term.red,
        "--terminal-key-bg": mixHex(term.background, term.foreground, 0.09),
        "--terminal-key-border": mixHex(term.background, term.foreground, 0.16),
        "--terminal-key-fg": mixHex(term.foreground, term.background, 0.25)
      };
    }

    const PACK_VAR_NAMES = Object.keys(derivePackVars(THEME_PACKS["threadterm-dark"]));

    function clearPackVars() {
      const root = document.documentElement;
      PACK_VAR_NAMES.forEach((name) => root.style.removeProperty(name));
    }

    function applyThemePack(packId) {
      const pack = THEME_PACKS[packId];
      if (!pack) return;
      const root = document.documentElement;
      root.dataset.theme = pack.mode;
      Object.entries(derivePackVars(pack)).forEach(([name, value]) => {
        root.style.setProperty(name, value);
      });
      const meta = $('meta[name="theme-color"]');
      if (meta) meta.content = pack.app.background;
    }
    /* ================= PC 主题联动层 END ================= */

    const state = {
      scenario: new URLSearchParams(location.search).get("scenario") || "attention",
      viewport: "390x844",
      tab: "workbench",
      route: null,
      routePayload: null,
      routeOrigin: null,
      routeStack: [],
      sheet: null,
      sheetPayload: null,
      scope: "all",
      attentionFilter: "all",
      workbenchSearch: "",
      workbenchSearchOpen: false,
      terminalSearch: "",
      terminalSegment: "active",
      terminalInput: "",
      terminalModifier: null,
      sessions: clone(BASE_SESSIONS),
      notifications: clone(BASE_NOTIFICATIONS),
      settings: clone(DEFAULT_SETTINGS),
      paired: true,
      connected: true,
      readOnly: false,
      scrollByTab: { workbench: 0, terminal: 0, settings: 0 },
      toastTimer: null,
      formErrors: {}
    };

    if (!["attention", "running", "empty", "warming", "offline"].includes(state.scenario)) {
      state.scenario = "attention";
    }

    function scenarioSnapshot() {
      const activeSessions = state.sessions.filter((session) => !session.archived);
      const createdGroups = activeSessions
        .filter((session) => session.demoCreated)
        .map((session) => ({
          id: `g-${session.id}`,
          project: session.project,
          path: session.projectPath,
          worktree: session.worktree,
          status: session.status,
          label: session.statusLabel,
          sessionIds: [session.id],
          attention: 0,
          lastActive: session.lastActive
        }));
      if (state.scenario === "empty") {
        const sessions = activeSessions.filter((session) => session.demoCreated);
        return { sessions, attention: [], groups: createdGroups };
      }
      if (state.scenario === "warming") {
        return { sessions: [], attention: [], groups: [] };
      }
      if (state.scenario === "running") {
        const sessions = activeSessions.map((session) => ({
          ...session,
          status: "running",
          statusLabel: "正常运行",
          preview: session.id === "s-docs" ? session.preview : "持续输出中，没有需要处理的信号"
        }));
        const groups = [...BASE_GROUPS, ...createdGroups].map((group) => ({
          ...group,
          status: "running",
          label: "运行中",
          attention: 0
        })).filter((group) => group.sessionIds.some((id) => sessions.some((session) => session.id === id)));
        return { sessions, attention: [], groups };
      }
      const sessionIds = new Set(activeSessions.map((session) => session.id));
      const ruleAllows = (item) => {
        if (item.kind === "approval" || item.kind === "input") return state.settings.ruleWaiting;
        if (item.kind === "failed") return state.settings.ruleFailed;
        if (item.kind === "review") return state.settings.ruleReview;
        if (item.kind === "stalled") return state.settings.ruleStalled;
        return true;
      };
      const attention = BASE_ATTENTION.filter((item) => sessionIds.has(item.sessionId) && ruleAllows(item));
      return {
        sessions: activeSessions,
        attention,
        groups: [...BASE_GROUPS, ...createdGroups]
          .filter((group) => group.sessionIds.some((id) => sessionIds.has(id)))
          .map((group) => ({
            ...group,
            sessionIds: group.sessionIds.filter((id) => sessionIds.has(id)),
            attention: attention.filter((item) => group.sessionIds.includes(item.sessionId)).length
          }))
      };
    }

    function scopeMatches(entity) {
      if (state.scope === "all") return true;
      const [project, ...worktreeParts] = state.scope.split("/");
      const worktree = worktreeParts.join("/");
      if (entity.project !== project) return false;
      return !worktree || entity.worktree === worktree;
    }

    function selectedScope() {
      return SCOPES.find((scope) => scope.id === state.scope) || SCOPES[0];
    }

    function attentionCounts(items) {
      return FILTERS.reduce((counts, [key]) => {
        counts[key] = key === "all" ? items.length : items.filter((item) => item.kind === key).length;
        return counts;
      }, {});
    }

    function filteredWorkbenchData() {
      const snapshot = scenarioSnapshot();
      const scopedAttention = snapshot.attention.filter(scopeMatches);
      const scopedGroups = snapshot.groups.filter(scopeMatches);
      const query = state.workbenchSearch.trim().toLocaleLowerCase();
      const matchesQuery = (entry) => !query || [
        entry.title, entry.evidence, entry.project, entry.worktree, entry.path
      ].filter(Boolean).some((value) => value.toLocaleLowerCase().includes(query));
      return {
        snapshot,
        scopedAttention,
        visibleAttention: scopedAttention
          .filter((item) => state.attentionFilter === "all" || item.kind === state.attentionFilter)
          .filter(matchesQuery),
        scopedGroups: scopedGroups.filter(matchesQuery)
      };
    }

    function statusIcon(status) {
      if (status === "failed") return "alert";
      if (status === "running") return "play";
      if (status === "review") return "eye";
      return "clock";
    }

    function unreadCount() {
      return state.notifications.filter((notification) => !notification.read).length;
    }

    function connectionLabel() {
      if (!state.paired) return "未配对";
      if (state.scenario === "warming") return "已连接 · 正在同步快照";
      if (!state.connected || state.scenario === "offline") return "离线 · 显示缓存快照";
      if (state.readOnly || state.settings.permission === "readonly") return "已连接 · 只读";
      return "已安全连接";
    }

    function syncTheme() {
      if (state.settings.themePack && THEME_PACKS[state.settings.themePack]) {
        applyThemePack(state.settings.themePack);
        return;
      }
      clearPackVars();
      const theme = state.settings.theme === "system"
        ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : state.settings.theme;
      document.documentElement.dataset.theme = theme;
      const meta = $('meta[name="theme-color"]');
      if (meta) meta.content = theme === "light" ? "#f4f6f9" : "#10151d";
    }

    function renderBottomNav() {
      const nav = $("#bottom-nav");
      const items = [
        ["workbench", "grid", "工作台"],
        ["terminal", "terminal", "终端"],
        ["settings", "settings", "设置"]
      ];
      nav.innerHTML = items.map(([id, iconName, label]) => `
        <button class="nav-button" data-action="tab" data-value="${id}"
          aria-current="${state.tab === id ? "page" : "false"}">
          ${icon(iconName, "icon-lg")}
          <span>${label}</span>
          ${id === "workbench" && unreadCount() ? '<i class="nav-dot" aria-hidden="true"></i>' : ""}
        </button>
      `).join("");
      nav.hidden = Boolean(state.route);
    }

    function connectionBanner() {
      if (state.scenario === "warming") {
        return `
          <div class="connection-banner" role="status" style="border-color:rgba(79,139,214,.3);background:var(--primary-soft)">
            ${icon("refresh")}
            <div class="connection-copy">
              <strong>正在同步工作台</strong>
              已建立安全连接，正在获取终端、通知和执行上下文快照。
            </div>
          </div>
        `;
      }
      if (state.connected && state.scenario !== "offline") return "";
      return `
        <div class="connection-banner" role="status">
          ${icon("wifi-off")}
          <div class="connection-copy">
            <strong>连接已中断</strong>
            正在显示最近一次缓存快照，交互操作暂不可用。
          </div>

    function searchMarkup(value, context, placeholder) {
      return `
        <div class="search-wrap">
          ${icon("search", "icon-sm")}
          <label class="sr-only" for="${context}-search">${escapeHTML(placeholder)}</label>
          <input id="${context}-search" data-input="${context}-search" value="${escapeHTML(value)}"
            placeholder="${escapeHTML(placeholder)}" autocomplete="off">
          ${value ? `<button class="search-clear" data-action="clear-search" data-value="${context}" aria-label="清空搜索">${icon("x", "icon-sm")}</button>` : ""}
        </div>
      `;
    }

    function emptyState(iconName, title, copy, actionLabel = "", action = "") {
      return `
        <div class="empty-state">
          <div class="empty-icon">${icon(iconName, "icon-lg")}</div>
          <h4>${escapeHTML(title)}</h4>
          <p>${escapeHTML(copy)}</p>
          ${actionLabel ? `<button class="secondary-button" data-action="${action}">${escapeHTML(actionLabel)}</button>` : ""}
        </div>
      `;
    }

    function attentionCard(item) {
      return `
        <button class="attention-card tone-${item.tone}" data-action="attention-detail" data-id="${item.id}">
          <i class="severity-line" aria-hidden="true"></i>
          <span class="card-main">
            <span class="card-topline">
              <span class="status-pill">${escapeHTML(item.label)}</span>
              <time class="card-time">${escapeHTML(item.time)}</time>
            </span>
            <strong class="card-title">${escapeHTML(item.title)}</strong>
            <span class="card-evidence">${escapeHTML(item.evidence)}</span>
            <span class="card-meta">
              ${icon("folder", "icon-sm")}
              <span>${escapeHTML(item.project)} · ${escapeHTML(item.worktree)}</span>
            </span>
          </span>
          ${icon("chevron-right", "chevron icon-sm")}
        </button>
      `;
    }

    function groupCard(group) {
      const toneClass = group.status === "failed" ? "failure" : group.attention ? "attention" : "live";
      return `
        <button class="group-card" data-action="group-detail" data-id="${group.id}">
          <span class="group-head">
            <span class="group-icon">${icon("git-branch")}</span>
            <span class="group-info">
              <strong class="group-title">${escapeHTML(group.project)}</strong>
              <span class="group-path">${escapeHTML(group.worktree)}</span>
            </span>
            ${icon("chevron-right", "chevron icon-sm")}
          </span>
          <span class="group-stats">
            <span class="mini-stat ${toneClass}">${icon(statusIcon(group.status), "icon-sm")} ${escapeHTML(group.label)}</span>
            <span class="mini-stat">${group.sessionIds.length} 个终端</span>
            ${group.attention ? `<span class="mini-stat attention">${group.attention} 项需关注</span>` : ""}
            <span class="mini-stat">${escapeHTML(group.lastActive)}</span>
          </span>
        </button>
      `;
    }

    function renderWorkbench() {
      const { scopedAttention, visibleAttention, scopedGroups } = filteredWorkbenchData();
      const counts = attentionCounts(scopedAttention);
      const snapshot = scenarioSnapshot();
      const scopedSessions = snapshot.sessions.filter(scopeMatches);
      const running = scopedSessions.filter((session) => session.status === "running").length;
      const review = scopedAttention.filter((item) => item.kind === "review").length;
      const failed = scopedAttention.filter((item) => item.kind === "failed").length;
      const searchActive = state.workbenchSearch.trim().length > 0;
      const scope = selectedScope();
      const warming = state.scenario === "warming";

      $("#app-screen").innerHTML = `
        <section class="page" data-page="workbench">
          <header class="page-header">
            <div class="header-row">
              <div class="header-title">
                <h2>工作台</h2>
                <div class="header-subtitle">
                  <i class="online-dot ${state.connected && state.scenario !== "offline" ? "" : "offline"}"></i>
                  ${escapeHTML(connectionLabel())}
                </div>
              </div>
              <button class="icon-button" data-action="toggle-workbench-search" aria-label="搜索"
                aria-pressed="${state.workbenchSearchOpen}">${icon("search")}</button>

            <button class="scope-button" data-action="open-scope" aria-label="选择项目与 Worktree 范围">

              <span class="scope-label">${escapeHTML(scope.label)}</span>
              ${icon("chevron-down", "icon-sm")}
            </button>

          </header>

          ${connectionBanner()}

          <div class="content">
            <div class="summary-grid" aria-label="状态摘要">
              <button class="summary-card action" data-action="summary-filter" data-value="all"
                aria-pressed="${state.attentionFilter === "all"}">
                <span class="summary-top"><span>需要处理</span>${icon("alert", "icon-sm")}</span>
                <strong class="summary-value">${counts.all}</strong>
              </button>
              <button class="summary-card running" data-action="summary-running">
                <span class="summary-top"><span>正常运行</span>${icon("play", "icon-sm")}</span>
                <strong class="summary-value">${running}</strong>
              </button>
              <button class="summary-card review" data-action="summary-filter" data-value="review"
                aria-pressed="${state.attentionFilter === "review"}">
                <span class="summary-top"><span>待复核</span>${icon("eye", "icon-sm")}</span>
                <strong class="summary-value">${review}</strong>
              </button>
              <button class="summary-card failed" data-action="summary-filter" data-value="failed"
                aria-pressed="${state.attentionFilter === "failed"}">
                <span class="summary-top"><span>异常</span>${icon("alert", "icon-sm")}</span>
                <strong class="summary-value">${failed}</strong>
              </button>
            </div>
            <p class="overlap-note">状态维度可能重叠，不代表会话总数。</p>

            <section class="section" id="attention-section">

                <button class="text-button" data-action="open-route" data-route="rules">${icon("slider", "icon-sm")} 规则</button>
              </div>
              <div class="chip-row" aria-label="注意事项分类">
                ${FILTERS.map(([key, label]) => `
                  <button class="chip" data-action="attention-filter" data-value="${key}"
                    aria-pressed="${state.attentionFilter === key}">
                    ${label}<span class="chip-count">${counts[key]}</span>
                  </button>
                `).join("")}
              </div>
              <div class="stack" style="margin-top:10px">
                ${visibleAttention.length
                  ? visibleAttention.map(attentionCard).join("")
                  : emptyState(
                      searchActive ? "search" : (warming ? "refresh" : (counts.all ? "slider" : "check")),
                      searchActive ? "没有匹配结果" : (warming ? "正在同步注意事项" : (counts.all ? "此分类没有事项" : "当前无需处理")),
                      searchActive ? "尝试更换关键词或范围。" : (warming ? "快照到达后会自动填充。" : (counts.all ? "选择其他分类查看。" : "需要介入的信号会集中出现在这里。")),
                      searchActive ? "清空搜索" : (!warming && counts.all ? "查看全部" : ""),
                      searchActive ? "clear-workbench-search" : (!warming && counts.all ? "show-all-attention" : "")
                    )}
              </div>

            <section class="section" id="groups-section">

                      searchActive ? "清空搜索" : (warming ? "" : "去新建终端"),

    function sessionCard(session) {
      return `

    function renderTerminalList() {
      const isArchived = state.terminalSegment === "archived";
      const query = state.terminalSearch.trim().toLocaleLowerCase();
      const snapshot = scenarioSnapshot();
      const scenarioIds = new Set(snapshot.sessions.map((session) => session.id));
      let sessions = state.sessions.filter((session) => session.archived === isArchived);
      if (!isArchived && state.scenario === "empty") {
        sessions = sessions.filter((session) => session.demoCreated);
      } else if (!isArchived && state.scenario !== "attention" && state.scenario !== "offline") {
        sessions = sessions
          .filter((session) => scenarioIds.has(session.id))

      }
      sessions = sessions.filter((session) => scopeMatches(session));
      if (query) {

          [session.name, session.project, session.worktree, session.type, session.preview]
            .some((value) => value.toLocaleLowerCase().includes(query))
        );

      sessions.sort((a, b) => Number(b.pinned) - Number(a.pinned));

              </button>
            </div>
          </header>

          ${connectionBanner()}

          <div class="content">
            ${Object.keys(grouped).length ? Object.entries(grouped).map(([key, groupSessions]) => {
              const [project, worktree] = key.split("|||");
              return `
                <section class="session-group">
                  <div class="session-group-head">
                    ${icon("git-branch", "icon-sm")}
                    <strong>${escapeHTML(project)} · ${escapeHTML(worktree)}</strong>
                    <span>${groupSessions.length}</span>

                  <div class="stack">${groupSessions.map(sessionCard).join("")}</div>
                </section>

              state.terminalSearch ? "search" : (state.scenario === "warming" ? "refresh" : (isArchived ? "archive" : "terminal")),
              state.terminalSearch ? "没有匹配的终端" : (state.scenario === "warming" ? "正在同步终端" : (isArchived ? "没有已归档终端" : "还没有终端")),
              state.terminalSearch ? "尝试更换关键词或项目范围。" : (state.scenario === "warming" ? "已连接桌面端，正在获取最新会话快照。" : (isArchived ? "归档后的终端会保留在这里。" : "创建一个会话，开始从手机监管和接管终端。")),

      let markup = "";
      switch (state.route) {

        case "notifications": markup = notificationsRoute(); break;

        case "pairing": markup = pairingRoute(); break;

        case "permissions": markup = permissionsRoute(); break;

      layer.setAttribute("aria-hidden", "false");

      if (state.route === "pairing") renderQrPattern();
      if (state.route === "terminal-detail") {
        requestAnimationFrame(() => {
          const output = $("#terminal-output");
          if (output) output.scrollTop = output.scrollHeight;

    function openRoute(route, payload = null) {
      if (state.route) {
        state.routeStack.push({ route: state.route, payload: state.routePayload });
      } else {
        state.scrollByTab[state.tab] = $("#app-screen").scrollTop;
        state.routeOrigin = { tab: state.tab, scroll: state.scrollByTab[state.tab] };
      }
      state.route = route;
      state.routePayload = payload;
      closeSheet(false);
      renderApp();
      requestAnimationFrame(() => {
        const heading = $(".push-header h2");
        if (heading) heading.setAttribute("tabindex", "-1");
        heading?.focus({ preventScroll: true });
      });
    }

    function closeRoute() {
      if (state.route === "pairing" && !state.paired) {
        showToast("请先完成配对", "lock");
        return;
      }
      const previous = state.routeStack.pop();
      state.route = previous?.route || null;
      state.routePayload = previous?.payload || null;
      state.terminalModifier = null;
      state.terminalInput = "";
      renderApp();
    }

    function renderQrPattern() {
      const grid = $("#qr-grid");
      if (!grid) return;
      const cells = [];
      for (let row = 0; row < 13; row += 1) {
        for (let col = 0; col < 13; col += 1) {
          const finder = (
            (row < 5 && col < 5) ||
            (row < 5 && col > 7) ||
            (row > 7 && col < 5)
          );
          const finderOn = finder && (
            row % 6 === 0 || col % 8 === 0 ||
            ((row % 6 > 1 && row % 6 < 4) && (col % 8 > 1 && col % 8 < 4))
          );
          const noise = ((row * 7 + col * 11 + row * col) % 5) < 2;
          cells.push(`<i class="${finderOn || (!finder && noise) ? "on" : ""}"></i>`);
        }
      }
      grid.innerHTML = cells.join("");
    }
