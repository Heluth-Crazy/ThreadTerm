          <h3>${escapeHTML(payload.title)}</h3>
          <p>${escapeHTML(payload.copy)}</p>
          <div class="dialog-actions">
            <button class="secondary-button" data-action="close-sheet">取消</button>
            <button class="${payload.danger ? "danger-button" : "primary-button"}"
              data-action="${payload.confirmAction}" data-id="${payload.id || ""}">
              ${escapeHTML(payload.confirmLabel)}
            </button>
          </div>
        </div>
      `;
    }

    function renderSheet() {
      if (!state.sheet) return closeSheet(false);
      let markup = "";
      if (state.sheet === "scope") markup = scopeSheet();
      else if (state.sheet === "session-menu") markup = sessionMenuSheet(state.sheetPayload);
      else if (state.sheet === "rename") markup = renameSheet(state.sheetPayload);
      else if (state.sheet === "confirm") markup = confirmSheet(state.sheetPayload);
      const sheet = $("#sheet");
      sheet.innerHTML = markup;
      sheet.classList.add("open");
      $("#sheet-backdrop").classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => {
        const focusTarget = $("input, button", sheet);
        focusTarget?.focus({ preventScroll: true });
      });
    }

    function showToast(message, iconName = "check") {
      const toast = $("#toast");
      toast.innerHTML = `${icon(iconName, "icon-sm")}<span>${escapeHTML(message)}</span>`;
      toast.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setScenario(value) {
      state.scenario = value;
      state.connected = value !== "offline";
      state.tab = "workbench";
      state.route = null;
      state.routeStack = [];
      state.sheet = null;
      state.scope = "all";
      state.attentionFilter = "all";
      state.workbenchSearch = "";
      state.workbenchSearchOpen = false;
      state.terminalSearch = "";
      state.terminalSegment = "active";
      state.sessions = clone(BASE_SESSIONS);
      state.notifications = clone(BASE_NOTIFICATIONS);
      const url = new URL(location.href);
      url.searchParams.set("scenario", value);
      try {
        history.replaceState({}, "", url);
      } catch {
        // file:// 直接打开时，部分 WebView 不允许改写当前 URL。
      }
      closeSheet(false);
      renderApp();
      showToast({
        attention: "已切换：高优先级场景",
        running: "已切换：正常运行场景",
        empty: "已切换：空工作区场景",
        warming: "已切换：正在同步场景",
        offline: "已切换：离线快照场景"
      }[value], "grid");
    }

    function resetPrototype() {
      state.viewport = "390x844";
      state.settings = clone(DEFAULT_SETTINGS);
      state.paired = true;
      state.readOnly = false;
      document.documentElement.style.setProperty("--phone-w", "390px");
      document.documentElement.style.setProperty("--phone-h", "844px");
      setScenario("attention");
      showToast("原型已重置", "refresh");
    }

    function switchTab(tab) {
      if (state.tab === tab && !state.route) {
        $("#app-screen").scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      state.scrollByTab[state.tab] = $("#app-screen").scrollTop;
      state.tab = tab;
      state.route = null;
      state.routePayload = null;
      state.routeStack = [];
      renderApp();
    }

    function setViewport(value) {
      const [width, height] = value.split("x");
      state.viewport = value;
      document.documentElement.style.setProperty("--phone-w", `${width}px`);
      document.documentElement.style.setProperty("--phone-h", `${height}px`);
      renderReviewControls();
      showToast(`视口 ${width} × ${height}`, "smartphone");
    }

    function requestConfirmation(payload) {
      openSheet("confirm", payload);
    }

    function handleAction(button) {
      const action = button.dataset.action;
      const value = button.dataset.value;
      const id = button.dataset.id;

      switch (action) {
        case "scenario":
          setScenario(value);
          break;
        case "viewport":
          setViewport(value);
          break;
        case "reset-prototype":
          resetPrototype();
          break;
        case "tab":
          switchTab(value);
          break;
        case "open-route":
          openRoute(button.dataset.route);
          break;
        case "open-pairing":
          openRoute("pairing");
          break;
        case "close-route":
          closeRoute();
          break;
        case "toggle-workbench-search":
          state.workbenchSearchOpen = !state.workbenchSearchOpen;
          if (!state.workbenchSearchOpen) state.workbenchSearch = "";
          renderApp();
          if (state.workbenchSearchOpen) requestAnimationFrame(() => $("#workbench-search")?.focus());
          break;
        case "clear-search":
          if (value === "workbench") {
            state.workbenchSearch = "";
            renderApp();
            requestAnimationFrame(() => $("#workbench-search")?.focus());
          } else {
            state.terminalSearch = "";
            renderApp();
            requestAnimationFrame(() => $("#terminal-search")?.focus());
          }
          break;
        case "clear-workbench-search":
          state.workbenchSearch = "";
          state.workbenchSearchOpen = true;
          renderApp();
          requestAnimationFrame(() => $("#workbench-search")?.focus());
          break;
        case "clear-terminal-search":
          state.terminalSearch = "";
          renderApp();
          requestAnimationFrame(() => $("#terminal-search")?.focus());
          break;
        case "open-scope":
          openSheet("scope");
          break;
        case "select-scope":
          state.scope = value;
          closeSheet(false);
          state.scrollByTab[state.tab] = 0;
          renderApp();
          showToast(`范围：${selectedScope().label}`, "folder");
          break;
        case "summary-filter":
          state.attentionFilter = value;
          renderApp();
          requestAnimationFrame(() => $("#attention-section")?.scrollIntoView({ behavior: "smooth", block: "start" }));
          break;
        case "summary-running":
          state.attentionFilter = "all";
          renderApp();
          requestAnimationFrame(() => $("#groups-section")?.scrollIntoView({ behavior: "smooth", block: "start" }));
          showToast("已定位到执行上下文", "play");
          break;
        case "attention-filter":
          state.attentionFilter = value;
          renderApp();
          break;
        case "show-all-attention":
          state.attentionFilter = "all";
          renderApp();
          break;
        case "attention-detail":
          openRoute("attention-detail", id);
          break;
        case "group-detail":
          openRoute("group-detail", id);
          break;
        case "go-new-terminal":
          state.tab = "terminal";
          openRoute("new-terminal");
          break;
        case "terminal-segment":
          state.terminalSegment = value;
          state.scrollByTab.terminal = 0;
          renderApp();
          break;
        case "open-terminal":
          closeSheet(false);
          openRoute("terminal-detail", id);
          break;
        case "session-menu":
          openSheet("session-menu", id);
          break;
        case "rename-session":
          openSheet("rename", id);
          break;
        case "toggle-pin": {
          const session = state.sessions.find((item) => item.id === id);
          if (session) session.pinned = !session.pinned;
          closeSheet(false);
          renderApp();
          showToast(session?.pinned ? "终端已置顶" : "已取消置顶", "pin");
          break;
        }
        case "confirm-archive":
          requestConfirmation({
            title: "归档这个终端？",
            copy: "终端会从运行列表移除，但名称和最后输出仍可在“已归档”中查看。",
            confirmLabel: "确认归档",
            confirmAction: "do-archive",
            id
          });
          break;
        case "do-archive": {
          const session = state.sessions.find((item) => item.id === id);
          if (session) session.archived = true;
          closeSheet(false);
          if (state.route === "terminal-detail") state.route = null;
          if (!state.route) state.routeStack = [];
          renderApp();
          showToast("终端已归档", "archive");
          break;
        }
        case "restore-session": {
          const session = state.sessions.find((item) => item.id === id);
          if (session) session.archived = false;
          state.terminalSegment = "active";
          closeSheet(false);
          renderApp();
          showToast("终端已恢复", "refresh");
          break;
        }
        case "confirm-close-session":
          requestConfirmation({
            title: "关闭并删除终端？",
            copy: "原型会移除这条会话记录。生产环境还需要检查未保存的工作区草稿。",
            confirmLabel: "关闭并删除",
            confirmAction: "do-close-session",
            id,
            danger: true
          });
          break;
        case "do-close-session":
          state.sessions = state.sessions.filter((item) => item.id !== id);
          state.notifications = state.notifications.filter((item) => {
            const attention = BASE_ATTENTION.find((entry) => entry.id === item.attentionId);
            return attention?.sessionId !== id;
          });
          closeSheet(false);
          if (state.route === "terminal-detail") state.route = null;
          if (!state.route) state.routeStack = [];
          renderApp();
          showToast("终端已关闭并删除", "trash");
          break;
        case "notification-open": {
          const notification = state.notifications.find((entry) => entry.id === id);
          if (notification) notification.read = true;
          if (notification?.attentionId) openRoute("attention-detail", notification.attentionId);
          else renderApp();
          break;
        }
        case "mark-all-read":
          state.notifications.forEach((notification) => { notification.read = true; });
          renderApp();
          showToast("通知已全部标为已读", "check");
          break;
        case "clear-notifications":
          requestConfirmation({
            title: "清空通知历史？",
            copy: "这不会改变终端或工作台事项，只移除当前原型中的通知记录。",
            confirmLabel: "清空",
            confirmAction: "do-clear-notifications",
            danger: true
          });
          break;
        case "do-clear-notifications":
          state.notifications = [];
          closeSheet(false);
          renderApp();
          showToast("通知历史已清空", "trash");
          break;
        case "reconnect":
          state.connected = true;
          if (state.scenario === "offline") state.scenario = "attention";
          renderApp();
          showToast("连接已恢复，快照已更新", "wifi");
          break;
        case "copy-address":
          copyText("ws://192.168.1.18:3976", "连接地址已复制");
          break;
        case "confirm-disconnect":
          requestConfirmation({
            title: "移除此设备？",
            copy: "移动端将清除配对状态，需要重新扫描二维码或输入配对码才能连接。",
            confirmLabel: "断开并移除",
            confirmAction: "do-disconnect",
            danger: true
          });
          break;
        case "do-disconnect":
          state.paired = false;
          state.connected = false;
          closeSheet(false);
          state.route = "pairing";
          state.routeStack = [];
          renderApp();
          showToast("设备已移除", "log-out");
          break;
        case "set-permission":
          state.settings.permission = value;
          state.readOnly = value === "readonly";
          renderApp();
          break;
        case "save-permissions":
          closeRoute();
          showToast("设备权限已更新", "shield");
          break;
        case "toggle-setting": {
          const key = button.dataset.key;
          state.settings[key] = !state.settings[key];
          renderApp();
          showToast(state.settings[key] ? "已开启" : "已关闭", "check");
          break;
        }
        case "reset-rules":
          Object.assign(state.settings, {
            ruleWaiting: true,
            ruleFailed: true,
            ruleReview: true,
            ruleStalled: false,
            stalledMinutes: 5
          });
          renderApp();
          showToast("已恢复默认规则", "refresh");
          break;
        case "save-rules":
          closeRoute();
          showToast("规则已保存到原型状态", "check");
          break;
        case "test-notification":
          state.notifications.unshift({
            id: `n-${Date.now()}`,
            title: "测试通知",
            body: "ThreadTerm 移动通知设置正常。",
            time: "刚刚",
            read: false
          });
          renderApp();
          showToast("测试通知已加入通知中心", "bell");
          break;
        case "set-theme":
          state.settings.theme = value;
          state.settings.themePack = null;
          renderApp();
          showToast(`主题已切换为${{ dark: "深色", light: "浅色", system: "跟随系统" }[value]}`, value === "light" ? "sun" : "moon");
          break;
        case "set-theme-pack":
        case "themepack": {
          state.settings.themePack = value || null;
          renderApp();
          const pack = THEME_PACKS[value];
          showToast(pack ? `主题包：${pack.label}（PC 联动演示）` : "已恢复默认外观", "palette");
          break;
        }
        case "set-language":
          state.settings.language = value;
          renderApp();
          showToast("语言偏好已更新（原型内容保持中文）", "language");
          break;
        case "copy-diagnostics":
          copyText("ThreadTerm Mobile Prototype v0.3\nconnection=ok\nsnapshot=1842\nlatency=18ms", "诊断信息已复制");
          break;
        case "simulate-offline":
          state.connected = false;
          state.scenario = "offline";
          state.route = null;
          state.routeStack = [];
          state.tab = "workbench";
          renderApp();
          showToast("已进入离线快照模式", "wifi-off");
          break;
        case "show-prototype-info":
          openRoute("prototype-info");
          break;
        case "show-licenses":
          openRoute("licenses");
          break;
        case "copy-version":
          copyText("ThreadTerm Mobile Prototype v0.3", "版本信息已复制");
          break;
        case "terminal-modifier":
          state.terminalModifier = state.terminalModifier === value ? null : value;
          renderRoute();
          break;
        case "terminal-key":
          handleTerminalKey(value);
          break;
        case "form-choice":
          selectFormChoice(button);
          break;
        case "close-sheet":
          closeSheet();
          break;
        default:
          break;
      }
    }

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      showToast(successMessage, "copy");
    }

    function selectFormChoice(button) {
      const group = button.dataset.group;
      const container = button.closest(`[data-choice-group="${group}"]`);
      $$(`[data-action="form-choice"]`, container).forEach((choice) => {
        choice.setAttribute("aria-pressed", String(choice === button));
      });
      const form = button.closest("form");
      const input = $(`input[name="${group === "terminal-type" ? "type" : "launchMode"}"]`, form);
      if (input) input.value = button.dataset.value;
      showToast(`已选择：${button.dataset.value}`, "check");
    }

    function handleTerminalKey(key) {
      const session = currentSession(state.routePayload);
      if (!session) return;
      if (state.terminalModifier) {
        const combo = `${state.terminalModifier}+${key}`;
        session.output.push({ text: `⌨ ${combo}（模拟快捷键）`, tone: "dim" });
        state.terminalModifier = null;
        renderRoute();
        showToast(`${combo} 已发送`, "keyboard");
        return;
      }
      if (key === "ArrowUp") state.terminalInput = "pnpm test";
      else if (key === "ArrowDown") state.terminalInput = "";
      else if (key === "Escape") {
        session.output.push({ text: "^Esc", tone: "dim" });
        showToast("Esc 已发送", "keyboard");
      } else if (key === "Tab") state.terminalInput += "\t";
      else state.terminalInput += key;
      renderRoute();
      requestAnimationFrame(() => {
        const input = $("#terminal-command");
        if (input) {
          input.focus();
          input.selectionStart = input.selectionEnd = input.value.length;
        }
      });
    }

    function showFormError(form, field, message) {
      const target = $(`[data-error-for="${field}"]`, form);
      if (target) target.textContent = message;
    }

    function submitNewTerminal(form) {
      const values = Object.fromEntries(new FormData(form));
      showFormError(form, "name", "");
      showFormError(form, "projectPath", "");
      const projectPath = String(values.projectPath || "").trim();
      if (!projectPath) {
        showFormError(form, "projectPath", "请输入项目路径。");
        $("#new-project", form)?.focus();
        return;
      }
      if (!/^[A-Za-z]:[\\/]/.test(projectPath) && !projectPath.startsWith("/")) {
        showFormError(form, "projectPath", "请输入 Windows 盘符路径或绝对路径。");
        $("#new-project", form)?.focus();
        return;
      }
      const rawName = String(values.name || "").trim();
      if (rawName.length > 48) {
        showFormError(form, "name", "名称不能超过 48 个字符。");
        return;
      }
      const project = projectPath.split(/[\\/]/).filter(Boolean).at(-1) || "Project";
      const type = String(values.type || "Codex");
      const restored = values.launchMode === "resume";
      const id = `s-created-${Date.now()}`;
      state.sessions.unshift({
        id,
        name: rawName || `${type.toLowerCase().replaceAll(" ", "-")}-${state.sessions.length + 1}`,
        project,
        projectPath,
        worktree: String(values.worktree || "main").trim() || "main",
        type,
        status: "running",
        statusLabel: "正常运行",
        lastActive: "刚刚",
        preview: restored ? "历史会话已恢复（原型）" : "新终端已启动（原型）",
        pinned: false,
        archived: false,
        demoCreated: true,
        output: [
          { text: `ThreadTerm ${restored ? "resumed" : "started"} ${type}`, tone: "blue" },
          { text: `Project: ${projectPath}`, tone: "dim" },
          { text: restored ? "历史 Provider 会话已恢复（模拟）。" : "PTY 已就绪（模拟）。", tone: "green" },
          { text: "" }
        ]
      });
      state.tab = "terminal";
      state.route = "terminal-detail";
      state.routePayload = id;
      state.routeStack = [];
      renderApp();
      showToast(restored ? "历史会话已恢复（模拟）" : "终端已创建（模拟）", "terminal");
    }

    function submitPairing(form) {
      const values = Object.fromEntries(new FormData(form));
      const address = String(values.address || "").trim();
      const token = String(values.token || "").replace(/\s/g, "");
      showFormError(form, "address", "");
      showFormError(form, "token", "");
      let valid = true;
      if (!/^wss?:\/\/[^ ]+$/i.test(address)) {
        showFormError(form, "address", "请输入 ws:// 或 wss:// 连接地址。");
        valid = false;
      }
      if (!/^\d{6}$/.test(token)) {
        showFormError(form, "token", "配对码应为 6 位数字。");
        valid = false;
      }
      if (!valid) return;
      state.paired = true;
      state.connected = true;
      if (state.scenario === "offline") state.scenario = "attention";
      state.route = null;
      state.routePayload = null;
      state.routeStack = [];
      state.tab = "workbench";
      renderApp();
      showToast("设备配对成功（模拟）", "shield");
    }

    function submitRename(form) {
      const id = form.dataset.sessionId;
      const name = String(new FormData(form).get("name") || "").trim();
      if (!name) {
        showFormError(form, "rename", "名称不能为空。");
        return;
      }
      const session = state.sessions.find((item) => item.id === id);
      if (session) session.name = name;
      closeSheet(false);
      renderApp();
      showToast("终端名称已更新", "edit");
    }

    function submitTerminalInput(form) {
      const id = form.dataset.sessionId;
      const input = $("#terminal-command", form);
      const command = String(input?.value || "").trim();
      if (!command) {
        showToast("请输入命令", "keyboard");
        input?.focus();
        return;
      }
      const session = state.sessions.find((item) => item.id === id);
      if (!session) return;
      session.output.push({ text: `$ ${command}` });
      state.terminalInput = "";
      renderRoute();
      setTimeout(() => {
        const target = state.sessions.find((item) => item.id === id);
        if (!target) return;
        target.output.push(
          { text: `模拟执行完成：${command}`, tone: "green" },
          { text: "真实版本会通过移动 Bridge 写入 PTY。", tone: "dim" }
        );
        target.preview = `模拟执行完成：${command}`;
        target.lastActive = "刚刚";
        if (state.route === "terminal-detail" && state.routePayload === id) renderRoute();
      }, 520);
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      event.preventDefault();
      handleAction(button);
    });

    document.addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      if (form.id === "new-terminal-form") submitNewTerminal(form);
      else if (form.id === "pairing-form") submitPairing(form);
      else if (form.id === "rename-form") submitRename(form);
      else if (form.id === "terminal-input-form") submitTerminalInput(form);
    });

    document.addEventListener("input", (event) => {
      const input = event.target;
      if (input.dataset.input === "workbench-search") {
        const cursor = input.selectionStart;
        state.workbenchSearch = input.value;
        renderApp();
        requestAnimationFrame(() => {
          const next = $("#workbench-search");
          next?.focus();
          if (next && cursor != null) next.setSelectionRange(cursor, cursor);
        });
      } else if (input.dataset.input === "terminal-search") {
        const cursor = input.selectionStart;
        state.terminalSearch = input.value;
        renderApp();
        requestAnimationFrame(() => {
          const next = $("#terminal-search");
          next?.focus();
          if (next && cursor != null) next.setSelectionRange(cursor, cursor);
        });
      } else if (input.dataset.input === "stalled-minutes") {
        state.settings.stalledMinutes = Number(input.value);
        const value = $(".range-value", input.closest(".info-card"));
        if (value) value.textContent = `${input.value} 分钟`;
      } else if (input.id === "terminal-command") {
        state.terminalInput = input.value;
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 104)}px`;
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (state.sheet) {
        event.preventDefault();
        closeSheet();
      } else if (state.route) {
        event.preventDefault();
        closeRoute();
      }
    });

    $("#app-screen").addEventListener("scroll", (event) => {
      state.scrollByTab[state.tab] = event.currentTarget.scrollTop;
      const header = $(".page-header", event.currentTarget);
      header?.classList.toggle("scrolled", event.currentTarget.scrollTop > 4);
    }, { passive: true });

    function initialize() {
      state.connected = state.scenario !== "offline";
      const now = new Date();
      $("#status-time").textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, "0")}`;
      // 跟随系统模式下，系统主题切换时实时重算（主题包激活时不干预）
      matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => {
        if (state.settings.theme === "system" && !state.settings.themePack) syncTheme();
      });
      renderApp();
    }

    initialize();
  </script>
</body>
