<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreadTerm 布局对比 - Before vs After</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0d14;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid rgba(226,232,240,0.08);
    background: rgba(10,13,20,0.8);
    backdrop-filter: blur(12px);
    height: 48px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header .badge-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .header .badge-row span { padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .badge-before { background: rgba(100,116,139,0.2); color: #94a3b8; }
  .badge-after { background: rgba(245,158,11,0.15); color: #f59e0b; }

  .main-view {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    border-right: 2px solid rgba(226,232,240,0.1);
  }
  .panel:last-child { border-right: none; }
  .panel-label {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 10;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 4px;
    pointer-events: none;
    letter-spacing: 0.02em;
  }
  .panel-label.before { background: rgba(100,116,139,0.25); color: #94a3b8; }
  .panel-label.after { background: rgba(245,158,11,0.2); color: #fbbf24; }

  .panel iframe {
    flex: 1;
    width: 100%;
    border: none;
    min-height: 0;
  }

  .diff-summary {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,19,28,0.95);
    border: 1px solid rgba(226,232,240,0.12);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 12px;
    display: flex;
    gap: 24px;
    backdrop-filter: blur(12px);
    z-index: 20;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .diff-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .diff-dot { width: 8px; height: 8px; border-radius: 50%; }
  .diff-dot.green { background: #22c55e; }
  .diff-dot.red { background: #ef4444; }
  .diff-dot.yellow { background: #f59e0b; }
</style>
</head>
<body>

<div class="header">
  <h1>ThreadTerm 布局原型 · 对比</h1>
  <div class="badge-row">
    <span class="badge-before">当前 layout-v1</span>
    <span>→</span>
    <span class="badge-after">调整后 layout-v2</span>
  </div>
</div>

<div class="main-view">
  <div class="panel">
    <div class="panel-label before">BEFORE · 当前布局</div>
    <iframe src="layout-v1-current.html" title="当前布局 layout-v1"></iframe>
  </div>
  <div class="panel">
    <div class="panel-label after">AFTER · 调整后布局</div>
    <iframe src="layout-v2-adjusted.html" title="调整后布局 layout-v2"></iframe>
  </div>
</div>

<div class="diff-summary">
  <div class="diff-item">
    <div class="diff-dot yellow"></div>
    <span>侧栏重构："全部终端" → "项目"，新建入口移至左侧顶部</span>
  </div>
  <div class="diff-item">
    <div class="diff-dot green"></div>
    <span>精修：终端逐行渲染、SVG 图标统一、8px 间距与字号下限</span>
  </div>
  <div class="diff-item">
    <div class="diff-dot red"></div>
    <span>右上角原"新建"按钮已移除</span>
  </div>
</div>

</body>
</html>
