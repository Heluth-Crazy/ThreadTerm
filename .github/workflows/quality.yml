name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Check frontend code quality
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build mobile application
        run: npm run build:mobile

      - name: Run Rust static checks
        run: npm run clippy

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install browser test engines
        run: npx playwright install chromium webkit

      - name: Run mobile browser flows
        run: npm run test:e2e:mobile

      - name: Run desktop browser flows
        run: npm run test:e2e:desktop

  stability:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Repeat connection and output recovery checks ten times
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            npx vitest run mobile-app/src/bridge/useBridgeConnection.test.tsx mobile-app/src/terminalFeed.test.ts src/components/terminal/outputAcknowledger.test.ts src/components/terminal/TerminalEventBridge.test.tsx --reporter=dot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Repeat real loopback bridge checks ten times
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            cargo test --manifest-path src-tauri/Cargo.toml bridge::tests --lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
