name: Feature request
description: Suggest an improvement to a ThreadTerm workflow.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the workflow you want to improve. Concrete examples are more useful than a list of controls.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to do in ThreadTerm?
      placeholder: "I keep three AI CLI sessions open while..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What feels slow, unclear, unreliable, or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the smallest change that would make the workflow better.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI CLI sessions
        - Terminal cards
        - Global selector
        - Floating terminal
        - Notifications
        - Themes/settings
        - Packaging/install
        - Documentation
        - Other
    validations:
      required: true
