<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreadTerm · 应用启动动画原型</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--ink:#20232b;--muted:#717581;--line:#e3e5ea;--panel:rgba(255,255,255,.76);--blue:#637cff;--shadow:rgba(47,58,90,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;transition:background .4s,color .4s;overflow:hidden}
body.dark{color-scheme:dark;--bg:#101115;--ink:#eceef4;--muted:#979aa8;--line:#2b2d36;--panel:rgba(29,30,37,.76);--shadow:rgba(0,0,0,.28)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.preview-head{position:absolute;top:28px;left:36px;right:36px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.preview-head strong{color:var(--ink);font-size:13px;font-weight:550;letter-spacing:0}.preview-head .tag{padding:6px 10px;border:1px solid var(--line);border-radius:20px;font-size:10px;letter-spacing:.12em}
.stage{position:relative;width:100vw;height:100svh;overflow:hidden;isolation:isolate}
.atmosphere{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,rgba(116,136,238,.08),transparent 49%)}
.grain{position:absolute;inset:0;opacity:.025;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.6' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}
canvas{position:absolute;inset:0;pointer-events:none}
.hub{position:absolute;left:50%;top:43%;width:112px;height:112px;transform:translate(-50%,-50%);z-index:3}
.halo{position:absolute;inset:-75px;border-radius:50%;background:radial-gradient(circle,rgba(137,151,255,.23),rgba(170,189,255,.08) 40%,transparent 67%);opacity:0;transform:scale(.65);will-change:transform,opacity}
.core{position:relative;width:112px;height:112px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(155deg,#aab5ff 0%,#728afb 34%,#5a67dc 73%,#8a82e7 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 5px rgba(41,42,122,.15),0 22px 60px rgba(92,106,188,.15);opacity:.35;transform:scale(.84);overflow:hidden;will-change:transform,opacity}
.core:before{content:"";position:absolute;inset:1px;border-radius:29px;background:linear-gradient(140deg,rgba(255,255,255,.32),transparent 46%);border:1px solid rgba(255,255,255,.15)}
.core:after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.3) 49%,transparent 62%);transform:translateX(-85%);opacity:0}
.core.lit:after{animation:sheen 1.15s ease-out forwards}@keyframes sheen{0%{transform:translateX(-85%);opacity:0}20%{opacity:.75}100%{transform:translateX(85%);opacity:0}}
.core svg{width:56px;height:56px;fill:none;stroke:white;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(53,57,128,.15))}
.ring{position:absolute;inset:-10px;border:1px solid rgba(127,148,248,.32);border-radius:40px;opacity:0;pointer-events:none;will-change:transform,opacity}
.agents{position:absolute;left:50%;top:43%;z-index:2}
.agent{position:absolute;left:-32px;top:-32px;width:64px;height:64px;display:grid;place-items:center;border-radius:19px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 35px var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);will-change:transform,opacity,filter;opacity:0}
.agent svg{width:32px;height:32px;color:var(--ink)}.agent .label{position:absolute;top:76px;white-space:nowrap;font-size:11px;letter-spacing:.015em;color:var(--muted);opacity:.85}
.identity{position:absolute;top:calc(43% + 96px);left:0;right:0;text-align:center;pointer-events:none}
h1{margin:0;font-size:30px;line-height:1.2;letter-spacing:-1.15px;font-weight:560;opacity:0;transform:translateY(8px)}
.subline{margin:14px 0 0;font-size:13px;letter-spacing:.025em;color:var(--muted);opacity:0;transform:translateY(6px)}
.status{position:absolute;left:0;right:0;top:calc(43% + 186px);display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:12px;opacity:0}
.status-dot{width:5px;height:5px;border-radius:50%;background:#8798e7;box-shadow:0 0 8px rgba(135,152,231,.3)}
.progress{position:absolute;width:100px;height:2px;background:var(--line);border-radius:4px;left:calc(50% - 50px);top:calc(43% + 219px);overflow:hidden;opacity:0}
.progress i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#bac4f8,#748bef);border-radius:4px}
.controls{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:5px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 8px 30px var(--shadow);backdrop-filter:blur(15px);white-space:nowrap}
.controls button{border:0;border-radius:10px;padding:0 13px;height:36px;font-size:12px;color:var(--muted);background:transparent;display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.controls button:hover{background:var(--line);color:var(--ink)}.controls button[aria-pressed="true"]{background:var(--line);color:var(--ink)}.controls button svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.divider{height:17px;width:1px;background:var(--line);margin:0 3px}.controls .primary{color:var(--ink)}
.scrubber{width:94px;height:3px;accent-color:#8396f3;cursor:pointer;margin:0 10px}.time{font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:38px;margin-right:9px}
.footnote{position:absolute;bottom:105px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);opacity:.8;letter-spacing:.02em}
body.clean .preview-head,body.clean .controls,body.clean .footnote{display:none}
@media(max-width:600px){.preview-head{left:20px;right:20px;top:22px}.preview-head .tag{display:none}.controls{bottom:22px;max-width:calc(100vw - 24px);gap:0}.controls button{padding:0 10px}.scrubber{width:55px;margin:0 7px}.controls .time{display:none}.footnote{bottom:90px;font-size:10px}h1{font-size:28px}.agent{width:54px;height:54px;left:-27px;top:-27px;border-radius:16px}.agent svg{width:28px;height:28px}.agent .label{top:64px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.core.lit:after{animation:none}body{transition:none}}
</style>
</head>

 let energy=0;
 specs.forEach((s,i)=>{
  const appear=easeOut((t-130-s.delay*.38)/850),start=1450+s.delay,u=clamp((t-start)/2050);
  const fade=1-smooth((u-.77)/.23),p=position(s,u,t),scale=lerp(1.035,.18,Math.pow(u,2.3));
  const introX=p.x*(1+(1-appear)*.16),introY=p.y*(1+(1-appear)*.16);
  const node=nodes[i];node.style.opacity=String(appear*fade);
  node.style.transform=`translate3d(${introX}px,${introY}px,0) rotate(${s.spin*(1-smooth(u))}deg) scale(${scale})`;
  node.style.filter=`blur(${((1-appear)*4+smooth((u-.76)/.24)*2.5).toFixed(2)}px)`;
  node.lastElementChild.style.opacity=String(1-smooth(u/.33));
  // Short, soft trails follow the incoming logo. They disappear as it joins the center.
  if(u>0&&u<1){for(let j=1;j<=15;j++){const older=clamp(u-j*.012),v=position(s,older,t-j*23),alpha=(1-j/16)*.16*Math.sin(u*Math.PI)*fade;ctx.fillStyle=`rgba(${s.color.join(',')},${alpha})`;ctx.beginPath();ctx.arc(cx+v.x,cy+v.y,(1-j/19)*1.7,0,Math.PI*2);ctx.fill()}}
  energy+=Math.exp(-Math.pow((u-.88)/.12,2))*.15;
 });
 const completion=smooth((t-3650)/1100),intro=easeOut(t/950);
 $('core').style.opacity=String(.28+.36*intro+.36*completion);
 $('core').style.transform=`scale(${.84+.16*completion+energy*.045})`;
 $('halo').style.opacity=String(.22*intro+energy*.6+.5*completion);
 $('halo').style.transform=`scale(${.7+energy*.25+completion*.3})`;
 const ring=smooth((t-4300)/200)*(1-smooth((t-4500)/800));
 $('ring').style.opacity=String(ring*.6);$('ring').style.transform=`scale(${1+smooth((t-4300)/1000)*.5})`;
 const title=easeOut((t-3550)/1000);$('wordmark').style.opacity=String(title);$('wordmark').style.transform=`translateY(${(1-title)*8}px)`;
 const sub=easeOut((t-4060)/950);$('subline').style.opacity=String(sub);$('subline').style.transform=`translateY(${(1-sub)*6}px)`;
 $('status').style.opacity=String(easeOut((t-680)/550)*.8);
 const ready=t>=4800;$('statusText').textContent=ready?'工作台已就绪':t>2200?'正在汇聚你的 AI 工作空间':'正在准备工作台';
 $('progress').style.opacity=String(easeOut((t-700)/550)*(1-smooth((t-5000)/700)));
 $('progressFill').style.transform=`scaleX(${clamp(t/4800)})`;
 if(t>=4400&&!lit){lit=true;$('core').classList.add('lit')}
 if(t<4400&&lit){lit=false;$('core').classList.remove('lit')}
 $('scrubber').value=String(t);$('time').textContent=(t/1000).toFixed(1)+'s';
 document.body.dataset.phase=t<1450?'float':t<4500?'converge':'ready';
}
function tick(now){if(!previous)previous=now;const delta=Math.min(now-previous,100);previous=now;if(!paused&&!document.hidden&&elapsed<duration){elapsed=Math.min(duration,elapsed+delta*speed);render(elapsed)}raf=requestAnimationFrame(tick)}
function setPaused(value){paused=value;$('pause').textContent=paused?'播放':'暂停';$('pause').setAttribute('aria-pressed',String(paused))}
function replay(){elapsed=reducedMotion.matches?duration:0;previous=0;lit=false;$('core').classList.remove('lit');setPaused(reducedMotion.matches);render(elapsed)}
$('replay').addEventListener('click',replay);
$('pause').addEventListener('click',()=>{if(elapsed===duration&&!paused)replay();else setPaused(!paused)});
$('slow').addEventListener('click',()=>{speed=speed===1?.5:1;$('slow').setAttribute('aria-pressed',String(speed===.5))});
$('theme').addEventListener('click',()=>{const dark=document.body.classList.toggle('dark');$('theme').textContent=dark?'浅色':'深色';$('theme').setAttribute('aria-pressed',String(dark));render(elapsed)});
$('scrubber').addEventListener('input',e=>{setPaused(true);elapsed=Number(e.target.value);render(elapsed)});
addEventListener('keydown',e=>{if(e.target.matches('button,input'))return;if(e.code==='Space'){e.preventDefault();setPaused(!paused)}if(e.key.toLowerCase()==='r')replay()});
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{previous=0});
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){elapsed=duration;setPaused(true);render(elapsed)}});
// Exposed only for deterministic visual review of this standalone prototype.
window.launchPreview={seek(ms){elapsed=clamp(ms,0,duration);setPaused(true);render(elapsed)},replay};
resize();replay();raf=requestAnimationFrame(tick);
</script>
