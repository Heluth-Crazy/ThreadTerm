# Electron Builder Configuration
# OpenWork Desktop - Cross-platform build configuration

# Application metadata
appId: com.openwork.desktop
productName: OpenWork Desktop
copyright: Copyright © 2026 OpenWork Contributors

# Build directories
directories:
  output: release
  buildResources: resources

# Main entry point
files:
  # Core application files
  - electron/**/*
  - dist/**/*
  - server/**/*
  - shared/**/*
  - package.json
  # Exclude development files
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  # Exclude source maps to reduce bundle size
  - "!**/*.map"
  # Exclude TypeScript source files
  - "!**/*.ts"
  # Exclude documentation and license files in node_modules
  - "!**/node_modules/**/LICENSE*"
  - "!**/node_modules/**/LICENSE"
  - "!**/node_modules/**/AUTHORS*"
  - "!**/node_modules/**/CONTRIBUTORS*"
  - "!**/node_modules/**/PATENTS*"
  - "!**/node_modules/**/NOTICE*"
  # Exclude ripgrep binaries for other platforms (only keep current platform)
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-darwin"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-darwin"

# ASAR configuration
asar: true
asarUnpack:
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sqlite3/**/*"
  - "**/node_modules/@openai/codex-win32-x64/**/*"
  - "**/node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/**/*"
  # Only unpack native modules that need to be extracted
  # Keep other modules in asar for better compression

# Extra resources to include (data directory)
extraResources:
  - from: "data"
    to: "data"
    filter:
      - "**/*"
  - from: "resources/icon.ico"
    to: "icon.ico"
  - from: "resources/file-icon.ico"
    to: "file-icon.ico"
  - from: "public/icons"
    to: "icons"
    filter:
      - "**/*"
  - from: "node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/codex"
    to: "codex-binary/win-x64"
    filter:
      - "**/*"

# macOS configuration (精简版 - 仅 arm64)
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: zip
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true

# DMG configuration
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  iconSize: 128

# Windows configuration
win:
  icon: resources/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  publisherName: OpenWork Contributors
  verifyUpdateCodeSignature: false

# NSIS installer configuration
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: OpenWork Desktop
  include: resources/installer.nsh
  license: LICENSE

# Portable configuration
portable:
  artifactName: "${productName} Portable ${version}.${ext}"

# Linux configuration (optional)
linux:
  category: Development
  icon: resources/icons
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  maintainer: OpenWork Contributors
  vendor: OpenWork Contributors
  synopsis: A desktop AI workspace
  description: OpenWork Desktop provides a native desktop experience for terminal-native AI workflows.

# Protocol handler (for deep linking)
protocols:
  - name: OpenWork Protocol
    schemes:
      - openwork

# File associations (optional)
fileAssociations:
  - ext: openwork
    name: OpenWork Project
    description: OpenWork project file
    icon: resources/file-icon.icns
    role: Editor
