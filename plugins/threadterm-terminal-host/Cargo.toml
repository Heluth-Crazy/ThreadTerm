[package]
name = "threadterm-terminal-host-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-host-protocol = { path = "../../src-tauri/terminal-host-protocol" }
threadterm-terminal-host = { path = "../../src-tauri/threadterm-terminal-host" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
