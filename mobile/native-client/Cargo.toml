[package]
name = "threadterm-mobile-native"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
httparse = "1.10"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uniffi = { version = "0.32.2", features = ["cli"] }
url = "2"
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3.14"

