[package]
name = "threadterm"
version = "0.3.0"
description = "ThreadTerm – desktop terminal manager for shell and AI CLI sessions"
authors = ["ThreadTerm Contributors"]
license = "MIT"
repository = "https://github.com/Heluth-Crazy/ThreadTerm"
edition = "2021"
rust-version = "1.77.2"
default-run = "threadterm"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
portable-pty = "0.8"
wezterm-term = { package = "tattoy-wezterm-term", version = "0.1.0-fork.5" }
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dashmap = "6"
regex = "1"
axum = { version = "0.7", features = ["ws"] }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
base64 = "0.22"
similar = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio-tungstenite = "0.21"
futures-util = "0.3"
proptest = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSKeyValueCoding", "NSObject", "NSString", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["objc2-app-kit", "WKWebView"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6.0"

# ---------------------------------------------------------------------------
# Release optimisation — reduces binary size and runtime memory significantly
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3        # Maximum optimisation
lto = "thin"         # Cross-crate inlining without full LTO link time cost
codegen-units = 1    # Single codegen unit → better dead-code elimination
strip = "symbols"    # Strip debug symbols from release binary
panic = "abort"      # Smaller binary; no unwinding tables needed in prod
