[package]
name = "openwork"
version = "0.1.0"
description = "OpenWork – Desktop UI for Claude Code, Cursor CLI, and OpenAI Codex"
authors = ["OpenWork Contributors"]
license = "MIT"
repository = "https://github.com/openwork-dev/OpenWork"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
notify = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
jsonwebtoken = "9"
bcrypt = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1"
dashmap = "6"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
git2 = "0.19"
shellexpand = "3"
which = "7"

# ---------------------------------------------------------------------------
# Release optimisation — reduces binary size and runtime memory significantly
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3        # Maximum optimisation
lto = "thin"         # Cross-crate inlining without full LTO link time cost
codegen-units = 1    # Single codegen unit → better dead-code elimination
strip = "symbols"    # Strip debug symbols from release binary
panic = "abort"      # Smaller binary; no unwinding tables needed in prod
