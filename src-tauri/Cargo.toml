[package]
name = "threadterm"
version = "0.3.0"
description = "ThreadTerm – desktop terminal manager for shell and AI CLI sessions"
authors = ["ThreadTerm Contributors"]
license = "MIT"
repository = "https://github.com/Heluth-Crazy/ThreadTerm"
edition = "2021"
rust-version = "1.77.2"
default-run = "threadterm"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["mobile-bridge", "stats-proxy"]
mobile-bridge = [
    "dep:axum",
    "dep:axum-server",
    "dep:rand",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:tower-http",
]
stats-proxy = [
    "dep:axum",
    "dep:futures-util",
    "dep:rand",
    "dep:reqwest",
]

[build-dependencies]
embed-resource = "=3.0.9"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
portable-pty = "0.8"
wezterm-term = { package = "tattoy-wezterm-term", version = "0.1.0-fork.5" }
dirs = "5"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
fs2 = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dashmap = "6"
regex = "1"
sysinfo = { version = "=0.30.13", default-features = false }
axum = { version = "0.7", features = ["ws"], optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
futures-util = { version = "0.3", optional = true }
rand = { version = "0.8", optional = true }
rcgen = { version = "0.13", optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"
proptest = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSKeyValueCoding", "NSObject", "NSString", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["objc2-app-kit", "WKWebView"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
window-vibrancy = "0.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows-core = "0.61.2"
window-vibrancy = "0.6.0"

# ---------------------------------------------------------------------------
# Release optimisation — reduces binary size and runtime memory significantly
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3        # Maximum optimisation
lto = "thin"         # Cross-crate inlining without full LTO link time cost
codegen-units = 1    # Single codegen unit → better dead-code elimination
strip = "symbols"    # Strip debug symbols from release binary
panic = "abort"      # Smaller binary; no unwinding tables needed in prod
