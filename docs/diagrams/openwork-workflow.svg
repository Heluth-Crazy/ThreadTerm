<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1365" viewBox="0 0 2048 1365" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">OpenWork Session Workflow Diagram</title>
  <desc id="wfDesc">OpenWork session workflow from project discovery to PTY-backed AI execution, operator interaction, approvals, persistence, sync, and cross-device access.</desc>
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="wfGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.40"/>
    </pattern>
    <filter id="wfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
    <marker id="wfArrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#60a5fa"/></marker>
    <marker id="wfArrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#34d399"/></marker>
    <marker id="wfArrowRose" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#fb7185"/></marker>
    <style>
      .title{font:700 48px 'Inter','SF Pro Display',sans-serif;fill:#f8fafc}
      .subtitle{font:500 20px 'Inter',sans-serif;fill:#9ca3af}
      .lane-title{font:700 24px 'Inter',sans-serif;fill:#f8fafc}
      .lane-sub{font:500 14px 'Inter',sans-serif;fill:#9ca3af}
      .pill{font:700 11px 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase}
      .node-title{font:700 20px 'Inter',sans-serif;fill:#f8fafc}
      .node-body{font:500 13px 'Inter',sans-serif;fill:#d1d5db}
      .legend{font:600 12px 'Inter',sans-serif;fill:#d1d5db}
    </style>
  </defs>
  <rect width="2048" height="1365" fill="url(#wfBg)"/>
  <rect width="2048" height="1365" fill="url(#wfGrid)" opacity="0.84"/>
  <circle cx="1700" cy="200" r="260" fill="#2563eb" opacity="0.08"/>
  <circle cx="300" cy="1180" r="300" fill="#059669" opacity="0.06"/>

  <text x="88" y="92" class="title">OpenWork — AI Session Lifecycle &amp; Operator Workflow</text>
  <text x="88" y="128" class="subtitle">From project selection to PTY-backed AI execution, approvals, editor/git sync, and optional LAN/mobile participation.</text>

  <g filter="url(#wfShadow)">
    <rect x="70" y="176" width="1908" height="192" rx="28" fill="rgba(15,23,42,0.84)" stroke="#334155" stroke-width="1.4"/>
    <rect x="70" y="406" width="1908" height="242" rx="28" fill="rgba(15,23,42,0.84)" stroke="#334155" stroke-width="1.4"/>
    <rect x="70" y="686" width="1908" height="252" rx="28" fill="rgba(15,23,42,0.84)" stroke="#334155" stroke-width="1.4"/>
    <rect x="70" y="976" width="1908" height="248" rx="28" fill="rgba(15,23,42,0.84)" stroke="#334155" stroke-width="1.4"/>
  </g>

  <text x="96" y="214" class="lane-title">1. Discover &amp; Select Workspace</text>
  <text x="96" y="240" class="lane-sub">Project and session metadata are loaded before the operator enters focus mode.</text>
  <text x="96" y="444" class="lane-title">2. Launch &amp; Attach AI Runtime</text>
  <text x="96" y="470" class="lane-sub">OpenWork starts a PTY, resolves the chosen CLI, and maps raw output to session-aware events.</text>
  <text x="96" y="724" class="lane-title">3. Operate the Session</text>
  <text x="96" y="750" class="lane-sub">Chat, terminal, editor, approvals, live-grid, and automation loops consume the same session state.</text>
  <text x="96" y="1014" class="lane-title">4. Persist, Sync &amp; Extend</text>
  <text x="96" y="1040" class="lane-sub">State changes propagate to files, git, LAN/mobile clients, and extension settings.</text>

  <g filter="url(#wfShadow)">
    <rect x="118" y="272" rx="20" width="360" height="78" fill="rgba(8,51,68,0.36)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="142" y="300" class="pill" fill="#67e8f9">ui</text>
    <text x="142" y="330" class="node-title">ProjectsOverview / Sidebar</text>

    <rect x="552" y="272" rx="20" width="360" height="78" fill="rgba(6,78,59,0.30)" stroke="#34d399" stroke-width="1.4"/>
    <text x="576" y="300" class="pill" fill="#86efac">backend</text>
    <text x="576" y="330" class="node-title">projects_list / projects_get</text>

    <rect x="986" y="272" rx="20" width="360" height="78" fill="rgba(76,29,149,0.30)" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="1010" y="300" class="pill" fill="#c4b5fd">state</text>
    <text x="1010" y="330" class="node-title">useProjectsState</text>

    <rect x="1420" y="272" rx="20" width="360" height="78" fill="rgba(120,53,15,0.28)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="1444" y="300" class="pill" fill="#fde68a">optional</text>
    <text x="1444" y="330" class="node-title">LAN / Mobile Login</text>
  </g>

  <g filter="url(#wfShadow)">
    <rect x="118" y="514" rx="20" width="320" height="96" fill="rgba(8,51,68,0.34)" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="142" y="542" class="pill" fill="#7dd3fc">user intent</text>
    <text x="142" y="572" class="node-title">Start / Resume Session</text>
    <text x="142" y="596" class="node-body">Pick Claude, Codex, or Cursor plus resume/profile options.</text>

    <rect x="500" y="514" rx="20" width="332" height="96" fill="rgba(6,78,59,0.34)" stroke="#34d399" stroke-width="1.4"/>
    <text x="524" y="542" class="pill" fill="#86efac">tauri command</text>
    <text x="524" y="572" class="node-title">Session Launch Command</text>
    <text x="524" y="596" class="node-body">resolve_cli() + build_args() decide the binary and invocation shape.</text>

    <rect x="894" y="514" rx="20" width="332" height="96" fill="rgba(6,78,59,0.28)" stroke="#10b981" stroke-width="1.4"/>
    <text x="918" y="542" class="pill" fill="#86efac">runtime</text>
    <text x="918" y="572" class="node-title">pty::create_command_pty</text>
    <text x="918" y="596" class="node-body">Creates the PTY, marks the session Running, and streams stdout/stderr.</text>

    <rect x="1288" y="514" rx="20" width="292" height="96" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="1312" y="542" class="pill" fill="#cbd5e1">provider</text>
    <text x="1312" y="572" class="node-title">CLI Process</text>
    <text x="1312" y="596" class="node-body">CLI runs in the project cwd and emits JSON/terminal lines.</text>

    <rect x="1642" y="494" rx="20" width="300" height="132" fill="rgba(136,19,55,0.30)" stroke="#fb7185" stroke-width="1.4"/>
    <text x="1666" y="522" class="pill" fill="#fda4af">translation</text>
    <text x="1666" y="552" class="node-title">TauriEventContext</text>
    <text x="1666" y="576" class="node-body">Parses JSONL, maps thread IDs, and emits Claude/Codex/approval UI events.</text>
  </g>

  <g filter="url(#wfShadow)">
    <rect x="118" y="810" rx="20" width="300" height="98" fill="rgba(8,51,68,0.34)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="142" y="838" class="pill" fill="#67e8f9">chat</text>
    <text x="142" y="868" class="node-title">ChatPanel / MessageList</text>
    <text x="142" y="892" class="node-body">Structured AI messages, markdown, approvals, and completion state.</text>

    <rect x="484" y="810" rx="20" width="300" height="98" fill="rgba(8,51,68,0.28)" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="508" y="838" class="pill" fill="#7dd3fc">terminal</text>
    <text x="508" y="868" class="node-title">TerminalGrid / HybridTerminal</text>
    <text x="508" y="892" class="node-body">Raw PTY stream stays available for direct shell control and inspection.</text>

    <rect x="850" y="810" rx="20" width="316" height="98" fill="rgba(8,51,68,0.28)" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="874" y="838" class="pill" fill="#7dd3fc">workspace</text>
    <text x="874" y="868" class="node-title">File Watcher + Git Events</text>
    <text x="874" y="892" class="node-body">File and git panels refresh when project state changes.</text>

    <rect x="1232" y="810" rx="20" width="320" height="98" fill="rgba(6,78,59,0.28)" stroke="#10b981" stroke-width="1.4"/>
    <text x="1256" y="838" class="pill" fill="#86efac">automation</text>
    <text x="1256" y="868" class="node-title">Tasks / Loops / LiveGrid</text>
    <text x="1256" y="892" class="node-body">Multiple sessions, task lists, and live cards share state and replay buffers.</text>

    <rect x="1618" y="790" rx="20" width="324" height="132" fill="rgba(136,19,55,0.28)" stroke="#fb7185" stroke-width="1.4"/>
    <text x="1642" y="818" class="pill" fill="#fda4af">attention</text>
    <text x="1642" y="848" class="node-title">Waiting / Approval / Error</text>
    <text x="1642" y="872" class="node-body">PTY state rules trigger notifications, TTS, and approval cards.</text>
  </g>

  <g filter="url(#wfShadow)">
    <rect x="118" y="1084" rx="20" width="306" height="100" fill="rgba(76,29,149,0.30)" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="142" y="1112" class="pill" fill="#c4b5fd">persist</text>
    <text x="142" y="1142" class="node-title">SQLite + ~/.openwork</text>
    <text x="142" y="1166" class="node-body">Settings, auth, projects.json, API token, and metadata stay durable.</text>

    <rect x="488" y="1084" rx="20" width="306" height="100" fill="rgba(120,53,15,0.28)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="512" y="1112" class="pill" fill="#fde68a">network</text>
    <text x="512" y="1142" class="node-title">Embedded Axum Server</text>
    <text x="512" y="1166" class="node-body">REST + WebSocket endpoints mirror the desktop workflow to LAN/mobile clients.</text>

    <rect x="858" y="1084" rx="20" width="306" height="100" fill="rgba(6,78,59,0.28)" stroke="#34d399" stroke-width="1.4"/>
    <text x="882" y="1112" class="pill" fill="#86efac">extensions</text>
    <text x="882" y="1142" class="node-title">Skills / MCP / Commands</text>
    <text x="882" y="1166" class="node-body">Extension settings feed back into future launches and tool surfaces.</text>

    <rect x="1228" y="1084" rx="20" width="306" height="100" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="1252" y="1112" class="pill" fill="#cbd5e1">project data</text>
    <text x="1252" y="1142" class="node-title">Repo Files + Git History</text>
    <text x="1252" y="1166" class="node-body">CLI and editor changes are reflected in the selected project tree.</text>

    <rect x="1598" y="1084" rx="20" width="344" height="100" fill="rgba(8,51,68,0.32)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="1622" y="1112" class="pill" fill="#67e8f9">result</text>
    <text x="1622" y="1142" class="node-title">Cross-Device Workspace</text>
    <text x="1622" y="1166" class="node-body">Same AI session model on desktop, browser, and mobile.</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M478 311 C512 311 520 311 552 311" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M912 311 C946 311 954 311 986 311" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1346 311 C1380 311 1388 311 1420 311" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>

    <path d="M278 368 C278 432 278 466 278 514" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M438 562 C462 562 474 562 500 562" stroke="#34d399" stroke-width="4" marker-end="url(#wfArrowGreen)"/>
    <path d="M832 562 C856 562 868 562 894 562" stroke="#34d399" stroke-width="4" marker-end="url(#wfArrowGreen)"/>
    <path d="M1226 562 C1250 562 1262 562 1288 562" stroke="#34d399" stroke-width="4" marker-end="url(#wfArrowGreen)"/>
    <path d="M1580 562 C1602 562 1612 562 1642 562" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>

    <path d="M1792 626 C1792 690 268 714 268 810" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1792 626 C1792 702 636 730 634 810" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1792 626 C1792 714 1012 744 1008 810" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1792 626 C1792 726 1392 752 1392 810" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1792 626 C1792 700 1780 726 1780 790" stroke="#fb7185" stroke-dasharray="10 8" stroke-width="4" marker-end="url(#wfArrowRose)"/>

    <path d="M268 908 C268 982 268 1014 268 1084" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M634 908 C634 982 640 1014 640 1084" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1008 908 C1008 982 1012 1014 1012 1084" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1392 908 C1392 982 1382 1014 1382 1084" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1780 922 C1780 982 1770 1014 1770 1084" stroke="#fb7185" stroke-dasharray="10 8" stroke-width="4" marker-end="url(#wfArrowRose)"/>

    <path d="M424 1134 C448 1134 460 1134 488 1134" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M794 1134 C818 1134 830 1134 858 1134" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1164 1134 C1188 1134 1200 1134 1228 1134" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <path d="M1534 1134 C1558 1134 1570 1134 1598 1134" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
  </g>

  <g filter="url(#wfShadow)">
    <rect x="70" y="1250" width="1908" height="66" rx="18" fill="rgba(15,23,42,0.90)" stroke="#334155" stroke-width="1.2"/>
    <text x="96" y="1292" class="lane-title" font-size="18">Legend</text>
    <rect x="190" y="1270" width="16" height="16" rx="5" fill="rgba(8,51,68,0.34)" stroke="#22d3ee"/>
    <text x="214" y="1283" class="legend">UI / frontend node</text>
    <rect x="392" y="1270" width="16" height="16" rx="5" fill="rgba(6,78,59,0.34)" stroke="#34d399"/>
    <text x="416" y="1283" class="legend">Backend runtime node</text>
    <rect x="648" y="1270" width="16" height="16" rx="5" fill="rgba(76,29,149,0.30)" stroke="#a78bfa"/>
    <text x="672" y="1283" class="legend">Persistence / state node</text>
    <line x1="980" y1="1278" x2="1030" y2="1278" stroke="#60a5fa" stroke-width="4" marker-end="url(#wfArrow)"/>
    <text x="1042" y="1283" class="legend">Primary session flow</text>
    <line x1="1288" y1="1278" x2="1338" y2="1278" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#wfArrowRose)"/>
    <text x="1350" y="1283" class="legend">Approval / attention branch</text>
  </g>
</svg>
