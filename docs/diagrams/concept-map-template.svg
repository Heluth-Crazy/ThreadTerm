    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#030712"/><stop offset="100%" stop-color="#111827"/></linearGradient>
  </defs>
  <rect width="2048" height="1365" fill="url(#bg)"/>
