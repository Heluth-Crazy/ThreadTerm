<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadTerm</title>
    <link rel="stylesheet" href="/src/bootSplash.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Launch screen (src/bootSplash.ts): in the first paint, held until the app has loaded. -->
    <div id="boot-splash" data-phase="intro" aria-busy="true">
      <div class="bs-stage">
        <div class="bs-atmosphere"></div>
        <div class="bs-grain"></div>
        <canvas class="bs-dust" aria-hidden="true"></canvas>
        <div class="bs-agents" aria-hidden="true"></div>
        <div class="bs-hub" aria-hidden="true">
          <div class="bs-halo"></div>
          <div class="bs-ring"></div>
          <div class="bs-core"><img class="bs-mark" src="./brand-mark.png" alt="" /></div>
        </div>
        <div class="bs-identity"><h1 class="bs-wordmark">ThreadTerm</h1><p class="bs-subline" lang="en">Every agent. One workspace.</p></div>
        <div class="bs-status" role="status" aria-live="polite"><span class="bs-dot"></span><span class="bs-status-text"></span></div>
        <div class="bs-progress" aria-hidden="true"><i></i></div>
      </div>
      <div class="bs-drag"></div>
    </div>
    <script>
      // Before the first paint: only the main window launches with the screen, in the theme and language the app
      // last resolved (saved by rememberBootAppearance in src/bootSplash.ts under the same key).
      (function () {
        var splash = document.getElementById("boot-splash");
        var query = new URLSearchParams(location.search);
        if (query.has("floating") || query.has("sessionId") || query.has("workspaceId")) { splash.remove(); return; }
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem("threadterm.v3.boot-appearance") || "{}") || {}; } catch (error) { saved = {}; }
        var dark = saved.theme === "dark" || (saved.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        splash.dataset.theme = dark ? "dark" : "light";
        splash.lang = saved.locale === "zh-CN" ? "zh-CN" : "en";
        if (query.get("chrome") === "native") splash.dataset.chrome = "native";
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) splash.dataset.motion = "reduced";
        var tokens = saved.tokens && typeof saved.tokens === "object" ? saved.tokens : {};
        ["background:bg", "surface:surface", "text:text", "muted:muted", "border:border"].forEach(function (pair) {
          var names = pair.split(":"), value = tokens[names[0]];
          if (typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value)) splash.style.setProperty("--splash-" + names[1], value);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
