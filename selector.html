<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadTerm · Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      /*
       * Solid near-black background: the selector window runs with
       * `decorations(false)` but NOT `transparent(true)` (see overlay.rs
       * for why), so anything behind the clip-path reveal is opaque.
       * We mimic an overlay feel by keeping it very dark so the backdrop
       * animation has visual continuity with the dimmed Tailwind shell.
       */
      html, body, #root { background: #050507; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/windows/selector/main.tsx"></script>
  </body>
</html>
